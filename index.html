  annexpuppet:{name:"Annex Puppet",di:50,desc:"Fully integrate your puppet state",can:(a,b)=>C[b].overlord===a&&!atWarAny(b), run:(a,b)=>{ for(const p of P) if(p.owner===b){p.owner=p.ctrl=a;} for(const x of G.armies) if(x.owner===b) x.owner=a; killCountry(b); mapDirty(true); return [true,C[b].name+" has been annexed."]; }},
  freepuppet:{name:"Grant Independence",di:0,desc:"Release your puppet",can:(a,b)=>C[b].overlord===a, run:(a,b)=>{ C[b].overlord=null; addRel(a,b,30); mapDirty(true); return [true,C[b].name+" is now independent."]; }},
  leave:{name:"Leave Alliance",di:0,desc:"",can:(a,b)=>sameAlliance(a,b)&&!G.wars.some(w=>(w.att.includes(a)&&w.att.includes(b))||(w.def.includes(a)&&w.def.includes(b))), run:(a,b)=>{ const al=allianceOf(a); al.members=al.members.filter(x=>x!==a); if(al.members.length<2) G.alliances=G.alliances.filter(x=>x!==al); addRel(a,b,-20); return [true,"You left the "+al.name+"."]; }},
  breaknap:{name:"Cancel Non-Aggression Pact",di:0,desc:"",can:(a,b)=>!!C[a].nap[b], run:(a,b)=>{ delete C[a].nap[b]; delete C[b].nap[a]; addRel(a,b,-15); return [true,"Pact cancelled."]; }},
};
function borderProvs(owner, neighbor){ const r=[]; for (const p of P){ if (p.owner!==owner) continue; if (p.adj.some(q=>P[q].owner===neighbor)||p.sea.some(q=>P[q].owner===neighbor)) r.push(p); } return r; }
function doDiplo(a,b,act){
  const d=DIPLO[act]; const ca=C[a]; if (!d||!d.can(a,b)) return [false,"Not possible right now."];
  if (ca.di<d.di) return [false,"Not enough diplomatic influence ("+d.di+" needed)."];
  if (d.ai && !C[b].isPlayer && !d.ai(a,b)) { ca.di-=Math.ceil(d.di/3); return [false,C[b].name+" declined your proposal."]; }
  if (d.ai && C[b].isPlayer && !C[a].isPlayer){ pushPending(b,{type:"proposal",from:a,act}); return [true,"proposal sent"]; }
  ca.di-=d.di; return d.run(a,b);
}
function diplomacyMonthly(){
  // relation drift
  for (const k in G.rel){ const v=G.rel[k]; const [a,b]=k.split("|"); if (!C[a]||!C[b]) continue; let t=0; if (sameAlliance(a,b)) t=50; if (C[a].tradeAg[b]) t+=10; if (atWar(a,b)) t=-80; G.rel[k]+= (t-v)*0.01; }
}

// ---------- POLITICS ----------
function politicsMonthly(c){
  if (c.tax>0.32) c.stability-=0.5;
  // elections
  if (govOf(c).elections && G.day>=c.nextElection){ c.nextElection=G.day+1460;
    if (c.isPlayer) pushPending(c.tag,{type:"election"}); else { const pr=PARTIES[Math.floor(Math.random()*PARTIES.length)]; pr.f(c); } }
  // coups and civil wars
  if (!c.isPlayer || true){
    if (c.stability<18 && !["D","R","C"].includes(c.gov) && Math.random()<0.03){ c.gov="J"; c.stability=40; c.lastGovChange=G.day; if (c.isPlayer) notify("🎖️ A military coup has overthrown your government! You now lead a Military Junta.","bad"); else news("🎖️ Military coup in "+c.name+"."); }
    if (c.stability<10 && Math.random()<0.025 && ownedProvs(c.tag).length>=3) civilWar(c);
  }
}
function civilWar(c){
  const own=ownedProvs(c.tag).filter(p=>p.ctrl===c.tag && p.id!==c.capital); if (own.length<2) return;
  const cap=P[c.capital]; own.sort((a,b)=>distKm(b,cap)-distKm(a,cap));
  const n=Math.max(1,Math.round(own.length*0.3)); const rebelProvs=own.slice(0,n);
  let i=1; let tag="RB"+c.tag+i; while (C[tag] && C[tag].alive){ i++; tag="RB"+c.tag+i; }
  const govs = c.gov==="D"||c.gov==="R"? "X" : "R";
  CDATA[tag]={tag,name:"Free "+c.baseName,capitalName:rebelProvs[0].name,pop:1,gdp:1,gov:govs,rel:c.rel,generated:true};
  const r=spawnCountry(tag,"Free "+c.baseName,c,{gov:govs,color:shade(c.color,-30),stability:60});
  for (const p of rebelProvs){ p.owner=p.ctrl=tag; p.occ=0; }
  r.capital=rebelProvs[0].id;
  let land=0; for (const a of G.armies) if (a.owner===c.tag){ for (const k in a.units) if(UNITS[k].kind==="land"){ const mv=a.units[k]*0.4; a.units[k]-=mv; land+=mv*UNITS[k].atk/4; } }
  createArmy(tag, r.capital, {inf:Math.max(3,Math.round(land))}, r.generals[0]);
  computeEconomy(r,true);
  declareWar(tag,c.tag,{civil:true,name:"Civil War in "+c.baseName,goal:"Independence"});
  c.stability=Math.max(c.stability,25);
  const msg="🔥 Civil war erupts in "+c.name+"! Rebels have seized "+n+" provinces.";
  if (c.isPlayer) { notify(msg,"bad"); sfx("war"); } else news(msg);
  mapDirty(true);
}
function changeGov(c,g){ if (c.gov===g) return [false,"Already that government."]; if (G.day-c.lastGovChange<365) return [false,"You changed government less than a year ago."]; c.gov=g; c.stability-=15; c.approval-=10; c.lastGovChange=G.day; if(GOVS[g].elections) c.nextElection=G.day+1460; return [true,"Government changed to "+GOVS[g].name+"."]; }

// ---------- FORMABLES ----------
function formableProgress(tag, f){
  const reqTags = f.req.filter(t=>P.some(p=>p.core===t)); if (!reqTags.length) return {have:0,total:0,ok:false,reqTags};
  let have=0,total=0; const missing=new Set();
  for (const p of P){ if (!reqTags.includes(p.core)) continue; total++; if (p.owner===tag) have++; else missing.add(p.core); }
  return {have,total,ok:have===total && total>0, reqTags, missing:[...missing]};
}
function canForm(tag, id){ const c=C[tag]; if (c.formed.includes(id)) return false; const f=FORMABLES[id]; if (id==="uae" && tag==="ARE") return false; return formableProgress(tag,f).ok; }
function formNation(tag, id){
  const c=C[tag], f=FORMABLES[id]; if (!canForm(tag,id)) return false;
  c.formed.push(id); c.name=f.name; c.flag=f.flag; c.color=f.color;
  for (const k in f.bonus) c.mods[k]=(c.mods[k]||0)+f.bonus[k];
  for (const p of P) if (f.req.includes(p.core) && p.owner===tag) p.resist=0;
  mapDirty(true);
  if (c.isPlayer){ ui && ui.formationAnim && ui.formationAnim(c,f); sfx("form"); } else news("👑 "+C[tag].name+" has been proclaimed by the former "+c.baseName+"!");
  return true;
}
function checkFormables(){
  for (const t in C){ const c=C[t]; if (!c.alive) continue;
    for (const id in FORMABLES){ if (c.formed.includes(id)) continue; const f=FORMABLES[id]; if (!f.req.includes(c.tag) && !f.req.some(r=>P.some(p=>p.core===r&&p.owner===t))) continue;
      if (canForm(t,id)){ if (c.isPlayer){ if (!c.formNotified) c.formNotified={}; if(!c.formNotified[id]){ c.formNotified[id]=true; notify("👑 You can now form the "+f.name+"! Open the Formables menu.","good"); sfx("tech"); } } else if (Math.random()<0.5) formNation(t,id); } } }
}

function eventsMonthly(){
  for (const t in C){ const c=C[t]; if (!c.alive) continue; if (c.isPlayer && pendingFor(t).length>2) continue;
    for (const ev of EVENTS){ if (!ev.cond(c)) continue; if (Math.random()>ev.chance*(c.isPlayer?2.2:1)) continue;
      const d = ev.prep ? ev.prep(c) : {}; if (d===null) continue;
      if (c.isPlayer){ pushPending(c.tag,{type:"event",id:ev.id,data:d}); }
      else { ev.opts[Math.floor(Math.random()*ev.opts.length)].f(c,d); if (c.gdp>500 && Math.random()<0.5 && ["recession","disaster","discovery"].includes(ev.id)) news("📰 "+ev.title+" in "+c.name+".", true); }
      break; } }

// ---------- MILITARY ACTIONS ----------
function queueBuild(c, pid, k){
  const p=P[pid], b=BUILDINGS[k]; if (p.owner!==c.tag) return [false,"You don't own this province."];
  if (b.coastal && !p.coastal) return [false,"Requires a coastal province."];
  if (b.req && !c.techs[b.req]) return [false,"Requires "+TECHS[b.req][0]+"."];
  const queued=c.buildQ.filter(q=>q.prov===pid&&q.b===k).length; if ((p.bld[k]||0)+queued>=b.max) return [false,"Maximum level reached."];
  const cost=bCost(c,k); if (c.treasury<cost) return [false,"Not enough money ($"+fmtB(cost)+" needed)."];
  c.treasury-=cost; c.buildQ.push({prov:pid,b:k,prog:0,total:b.days}); return [true,b.name+" queued in "+p.name+"."];
}
function canRecruit(c,k,pid){
  const u=UNITS[k], p=P[pid]; if (p.owner!==c.tag||p.ctrl!==c.tag) return "Province not under your control.";
  if (u.req && !c.techs[u.req]) return "Requires "+TECHS[u.req][0];
  if (u.bld==="milfac" && !countBld(c.tag,"milfac")) return "Requires a Military Factory";
  if (u.bld==="airbase" && !(p.bld.airbase)) return "Requires an Airbase here";
  if (u.bld==="dockyard" && !(p.bld.dockyard)) return "Requires a Naval Dockyard here";
  if (u.bld==="port" && !(p.bld.port||p.bld.dockyard)) return "Requires a Port here";
  if (c.bankrupt) return "Bankrupt";
  return null;
}
function recruit(c,k,n,pid){
  const err=canRecruit(c,k,pid); if (err) return [false,err];
  const u=UNITS[k]; const cost=uCost(c,k)*n, mp=u.mp*1000*n;
  let resCost=0; for (const r of ["steel","oil"]){ const need=(u[r]||0)*n*0.1; const have=Math.max(0,c.stock[r]||0); if (have<need) resCost+=(need-have)*G.market.price[r]*1.1; }
  if (c.treasury<cost+resCost) return [false,"Not enough money ($"+fmtB(cost+resCost)+" needed)."];
  if (c.manpower<mp) return [false,"Not enough manpower ("+fmtN(mp)+" needed)."];
  c.treasury-=cost+resCost; c.manpower-=mp; for (const r of ["steel","oil"]){ const need=(u[r]||0)*n*0.1; c.stock[r]=Math.max(0,(c.stock[r]||0)-need); }
  c.recruitQ.push({u:k,n,prov:pid,prog:0,total:u.days}); return [true,"Training "+n+"× "+u.name+"."];
}
function missileStrike(c, pid, nuke){
  const p=P[pid]; if (!countBld(c.tag,"missile")) return [false,"You need a Missile Facility."];
  if (nuke && !c.techs.nuc1) return [false,"Requires Nuclear Weapons."];
  if (!atWar(c.tag,p.ctrl) && !atWar(c.tag,p.owner)) return [false,"You can only strike enemies you are at war with."];
  if (c.missileCd>0) return [false,"Missile forces are rearming ("+c.missileCd+" days)."];
  const cost = nuke? 20 : 3; if (c.treasury<cost) return [false,"Not enough money ($"+cost+"B)."];
  c.treasury-=cost; c.missileCd = nuke?90:30;
  const kill = nuke?0.75:0.12;
  for (const a of G.armies) if (a.prov===pid && atWar(a.owner,c.tag)) for (const k in a.units) a.units[k]*=1-kill;
  if (nuke){ p.bld={}; p.pop*=0.5; p.base*=0.4; c.stability-=20; for (const t in C){ if (t!==c.tag && C[t].alive) addRel(t,c.tag,-40); } G.worldTension+=30; sfx("nuke"); notify("☢️ Nuclear strike on "+p.name+". The world is horrified.","war",pid); news("☢️ "+c.name+" launched a nuclear strike on "+p.name+"!"); }
  else { const ks=Object.keys(p.bld).sort((x,y)=>p.bld[y]-p.bld[x]); if (ks.length){ const k=ks[0]; p.bld[k]--; if(p.bld[k]<=0) delete p.bld[k]; } sfx("war"); notify("🚀 Missile strike hit "+p.name+".","good",pid); }
  mapDirty(false); return [true,"Strike launched."];
}

// ---------- SAVE / LOAD ----------
function serialize(){
  const prov = P.map(p=>[p.owner,p.ctrl,p.bld,+p.occ.toFixed(1),+p.resist.toFixed(1),+p.base.toFixed(4),+p.pop.toFixed(5),p.res,p.core]);
  return JSON.stringify({v:1,mapId:MAP_ID,nprov:P.length,G:Object.assign({},G,{sel:null}),C,CDATA_extra:Object.fromEntries(Object.entries(CDATA).filter(([k,v])=>v.generated||k.startsWith("RB"))),prov});
}
function deserialize(str){
  const s=JSON.parse(str); if (s.mapId!==MAP_ID || s.nprov!==P.length) throw new Error("This save was made with a different world map.");
  Object.assign(CDATA, s.CDATA_extra||{}); G=s.G; C=s.C; G.pendingEvents=G.pendingEvents||[]; if (!s.keepPlayers) for (const t in C) C[t].isPlayer=(t===G.player); G.mp=null;
  s.prov.forEach((r,i)=>{ const p=P[i]; [p.owner,p.ctrl,p.bld,p.occ,p.resist,p.base,p.pop,p.res,p.core]=r; });
  mapDirty(true);
}
function saveGame(slot){ try{ localStorage.setItem("wd_save_"+slot, serialize()); localStorage.setItem("wd_save_meta_"+slot, JSON.stringify({date:dateStr(G.day),country:G.player?C[G.player].name:"Spectator",real:Date.now()})); return true; }catch(e){ return false; } }
function loadSlot(slot){ try{ const s=localStorage.getItem("wd_save_"+slot); if(!s) return false; deserialize(s); return true; }catch(e){ alertBox("Could not load save: "+e.message); return false; } }
function saveMeta(slot){ try{ return JSON.parse(localStorage.getItem("wd_save_meta_"+slot)||"null"); }catch(e){ return null; } }
async function exportCode(){ const s=serialize(); try{ if (window.CompressionStream){ const cs=new Blob([s]).stream().pipeThrough(new CompressionStream("gzip")); const buf=new Uint8Array(await new Response(cs).arrayBuffer()); let bin=""; for (let i=0;i<buf.length;i+=8192) bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192)); return "WDZ1:"+btoa(bin); } }catch(e){} return "WDJ1:"+btoa(unescape(encodeURIComponent(s))); }
async function importCode(code){ code=code.trim(); let s; if (code.startsWith("WDZ1:")){ const bin=atob(code.slice(5)); const buf=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i); const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip")); s=await new Response(ds).text(); } else if (code.startsWith("WDJ1:")) s=decodeURIComponent(escape(atob(code.slice(5)))); else throw new Error("Not a valid save code."); deserialize(s); }

// ---------- formatting ----------
function fmtB(x){ const a=Math.abs(x); if (a>=1000) return (x/1000).toFixed(2)+"T"; if (a>=10) return x.toFixed(0)+"B"; if (a>=1) return x.toFixed(1)+"B"; return (x*1000).toFixed(0)+"M"; }
function fmtN(x){ const a=Math.abs(x); if (a>=1e9) return (x/1e9).toFixed(2)+"B"; if (a>=1e6) return (x/1e6).toFixed(1)+"M"; if (a>=1e3) return (x/1e3).toFixed(0)+"K"; return Math.round(x)+""; }
function fmtPop(m){ return m>=1000? (m/1000).toFixed(2)+"B" : m>=1? m.toFixed(1)+"M" : (m*1000).toFixed(0)+"K"; }
function shade(hex,amt){ let c=hex.replace("#",""); if(c.length===3) c=c.split("").map(x=>x+x).join(""); const n=parseInt(c,16); let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt; r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b)); return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

// ================= AI =================
function aiCountries(){ const r=[]; for (const t in C){ const c=C[t]; if (c.alive && !c.isPlayer) r.push(c); } return r; }
function enemyArmyStrengthAt(tag,pid){ const p=P[pid]; let s=0; for (const a of G.armies) if (a.prov===pid && atWar(a.owner,tag)) s+=armyPowerAt(a,p,a.owner===p.ctrl||isAlly(a.owner,p.ctrl)); return s; }
function armyStrength(a){ return armyPower(a); }

function aiDaily(){
  if (G.day%2!==0) return;
  for (const w of G.wars){
    for (const t of w.att.concat(w.def)){
      const c=C[t]; if (!c||!c.alive||c.isPlayer) continue;
      if ((hashStr(t)+G.day/2)%2!==0) continue;
      const enemies = w.att.includes(t)? w.def : w.att;
      const armies = G.armies.filter(a=>a.owner===t && !a.battle && !a.retreating && !a.path.length && landSize(a)>0.5);
      armies.forEach((a,i)=>aiArmyOrder(a,c,enemies,i));
    }
  }
}
function aiArmyOrder(a,c,enemies,i,filter){
  if (a.training) return;
  if (hostileProv(a.owner,a.prov)) return; // occupying
  if (a.org<35) return; // recovering
  const cap=P[c.capital];
  const ok = q => hostileProv(a.owner,q) && (!filter || filter(q));
  // defend the capital if threatened
  if (!filter && i===0 && cap && cap.ctrl===c.tag){ const threat=cap.adj.some(q=>G.armies.some(b=>b.prov===q && atWar(b.owner,c.tag))); if (threat && a.prov!==cap.id){ orderMove(a,cap.id); return; } }
  const myS=armyPower(a);
  // adjacent targets
  let best=null,bs=-1e9; const here=P[a.prov];
  const neigh = here.adj.concat(armyCaps(a).seaOK?here.sea:[]);
  for (const q of neigh){ if (!ok(q)) continue; const es=enemyArmyStrengthAt(a.owner,q); if (es>=armyPowerAt(a,P[q],false)) continue; const sc=provValue(P[q])*0.2 - es*0.05 + (P[q].core===c.tag?30:0) + (q===C[P[q].ctrl]?.capital?20:0) - q*1e-6; if (sc>bs){bs=sc;best=q;} }
  if (best!==null){ orderMove(a,best); return; }
  // otherwise head to the nearest enemy-held province
  const cands=[]; for (const p of P){ if (!ok(p.id) || enemyArmyStrengthAt(a.owner,p.id)>=myS) continue; cands.push([distKm(here,p),p.id]); }
  cands.sort((x,y)=>x[0]-y[0]);
  const off = filter ? (i||0)%Math.max(1,Math.min(3,cands.length)) : 0;
  for (let k=0;k<Math.min(8,cands.length);k++){ if (orderMove(a,cands[(k+off)%cands.length][1])) return true; }
  return false;
}

// ---------- auto-invasion (player "Capture" orders) ----------
function invadeFilter(target){ return target==="all" ? null : (q=>P[q].owner===target); }
function invasionDone(owner,target){ if (target==="all") return !P.some(p=>hostileProv(owner,p.id)); if (!C[target]||!C[target].alive||!atWar(owner,target)) return true; return !P.some(p=>p.owner===target && hostileProv(owner,p.id)); }
function autoArmies(){
  if (G.day%2!==0) return;
  const done={};
  G.armies.forEach((a,i)=>{
    if (!a.auto) return;
    const key=a.owner+"|"+a.auto;
    if (done[key]===undefined) done[key]=invasionDone(a.owner,a.auto);
    if (done[key]){ const t=a.auto; a.auto=null; if (a.owner===G.player && !done[key+"n"]){ done[key+"n"]=true; notify(t==="all"?"🏁 Invasion complete: no enemy territory left to capture.":"🏁 Invasion of "+(C[t]?C[t].name:t)+" complete.","good"); } return; }
    if (a.battle||a.retreating||a.path.length||landSize(a)<0.3) return;
    aiArmyOrder(a,C[a.owner],null,i,invadeFilter(a.auto));
  });
}
// AI terrain training
function aiTraining(c){ if (Math.random()>0.06 || c.treasury<c.gdp*0.05+1 || atWarAny(c.tag)) return; const a=G.armies.find(x=>x.owner===c.tag&&!x.path.length&&!x.battle&&!x.training&&landSize(x)>1); if (!a) return; const cnt={}; for (const p of ownedProvs(c.tag)) cnt[p.terrain]=(cnt[p.terrain]||0)+1; const t=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0]; if (t) startTraining(a,t); }

function aiMonthly(){
  const settings=G.settings.aiAggr; let aiWars=G.wars.filter(w=>!w.att.concat(w.def).includes(G.player)).length;
  for (const c of aiCountries()){
    const t=c.tag;
    // taxes
    if (c.net<0 && c.stability>40) c.tax=Math.min(0.35,c.tax+0.02); else if (c.stability<35) c.tax=Math.max(0.1,c.tax-0.02); else if (c.net>c.gdp*0.01 && c.tax>0.18) c.tax-=0.01;
    aiTraining(c);
    // research
    for (let i=0;i<c.research.length;i++){ if (c.research[i]) continue; const avail=Object.keys(TECHS).filter(id=>!c.techs[id] && !c.research.some(r=>r&&r.id===id) && TECHS[id][3].every(q=>c.techs[q])); if (avail.length){ avail.sort((x,y)=>TECHS[x][2]-TECHS[y][2]); const pick=avail[Math.floor(Math.random()*Math.min(4,avail.length))]; c.research[i]={id:pick,prog:0}; } }
    // construction
    const own=ownedProvs(t).filter(p=>p.ctrl===t); if (!own.length) continue;
    const reserve=c.gdp*0.01+0.3;
    const rich = c.treasury > c.gdp*0.25+2;
    if (c.treasury > c.gdp*0.15 && c.debt>0){ const x=Math.min(c.debt,(c.treasury-c.gdp*0.1)*0.5); c.debt-=x; c.treasury-=x; }
    const slotsAI = 2+Math.floor(countBld(t,"factory")/4);
    for (let tries=0; tries<(rich?3:1); tries++) if (c.buildQ.length<(rich?slotsAI+1:2) && c.treasury>reserve){
      const focus = atWarAny(t)?"mil":c.ai.focus; let opts;
      if (focus==="eco") opts=["factory","commercial","infra","factory","farm","mine","port"]; else if (focus==="sci") opts=["university","lab","factory","infra","commercial"]; else opts=["milfac","factory","fort","airbase","infra","commercial"];
      const k=opts[Math.floor(Math.random()*opts.length)];
      const sorted=own.slice().sort((a,b)=>b.base-a.base);
      for (const p of sorted.slice(0,4)){ if (c.treasury<bCost(c,k)+reserve) break; const [ok]=queueBuild(c,p.id,k); if (ok) break; }
    }
    // recruitment
    const land = G.armies.filter(a=>a.owner===t).reduce((s,a)=>s+landSize(a),0);
    const desired = (2+Math.sqrt(Math.max(0,c.gdp))*0.6)*(atWarAny(t)?1.6:1)*(1+c.ai.aggr*0.5)*(rich?1.3:1);
    const queued=c.recruitQ.reduce((s,q)=>s+q.n,0);
    if (land+queued<desired && c.treasury>reserve){
      const cap=P[c.capital].owner===t&&P[c.capital].ctrl===t?c.capital:own[0].id;
      let k="inf"; if (c.techs.armor2 && countBld(t,"milfac") && Math.random()<0.35) k="tank"; else if (countBld(t,"milfac") && Math.random()<0.25) k="art"; else if (c.techs.armor1 && countBld(t,"milfac") && Math.random()<0.25) k="mech";
      const n=Math.max(1,Math.min(Math.ceil(desired-land-queued), Math.floor((c.treasury-reserve)/uCost(c,k)), Math.floor(c.manpower/(UNITS[k].mp*1000)), 12));
      if (n>0) recruit(c,k,n,cap);
    }
    // merge idle armies sitting together at home
    const idle=G.armies.filter(a=>a.owner===t&&!a.path.length&&!a.battle);
    for (let i=0;i<idle.length;i++) for (let j=i+1;j<idle.length;j++){ if (idle[i].prov===idle[j].prov && armySize(idle[j])>0){ for (const k in idle[j].units) idle[i].units[k]=(idle[i].units[k]||0)+idle[j].units[k]; idle[j].units={}; } }
    // diplomacy
    if (Math.random()<0.15){ const nb=neighborsOf(t).filter(x=>C[x]&&C[x].alive&&!C[x].isPlayer); if (nb.length){ const b=nb[Math.floor(Math.random()*nb.length)]; const r=getRel(t,b);
      if (r>25 && !c.tradeAg[b]) doDiplo(t,b,"trade"); else if (r>65 && !isAlly(t,b) && !allianceOf(b) && Math.random()<0.3) doDiplo(t,b,"alliance"); else if (r>-20 && r<40 && c.di>20) doDiplo(t,b,"improve"); else if (r<-40 && !c.nap[b] && strengthRatio(b,t)>1.5) doDiplo(t,b,"nap"); } }
    // war declarations
    if (!atWarAny(t) && settings!=="peaceful" && G.day>60){
      const thr = settings==="aggressive"? 0.35 : 0.6; const ch = settings==="aggressive"? 0.03 : 0.012;
      const cap = settings==="aggressive"? 8 : 3;
      if (c.ai.aggr>thr && Math.random()<ch*(c.ai.aggr+0.3) && aiWars<cap && G.day-c.ai.lastWar>(settings==="aggressive"?360:720) && c.stability>30 && !c.overlord){
        const relT = settings==="aggressive"? 15 : -10;
        const nb=neighborsOf(t).filter(b=>C[b]&&C[b].alive&&!isAlly(t,b)&&!inTruce(t,b)&&!c.nap[b]&&!C[b].overlord&&getRel(t,b)< (C[b].isPlayer?Math.min(-30,relT):relT));
        let target=null,best=0;
        for (const b of nb){ let defS=milStrength(b); const al=allianceOf(b); if (al) for (const m of al.members) if (m!==b) defS+=milStrength(m)*0.5; for (const x in C) if (C[x].alive&&(C[x].defPact[b]||C[x].guarantee[b])) defS+=milStrength(x)*0.5;
          const ratio=(milStrength(t)+1)/(defS+1); const need=(C[b].isPlayer?2.0:1.6)*(settings==="aggressive"?0.8:1); if (ratio>need){ const sc=ratio*sideValue([b]); if (sc>best){best=sc;target=b;} } }
        if (target){ if (!c.cb[target]) c.cb[target]=true; const w=declareWar(t,target,{goal:"Conquest"}); if (w){ c.ai.lastWar=G.day; aiWars++; } }
      }
    }
  }
  // peace decisions
  for (const w of G.wars.slice()){
    if (w.ended) continue; const A=w.leaderA, D=w.leaderD; if (!C[A]||!C[D]) continue;
    const dur=G.day-w.start; const s=w.score; // attacker perspective
    const plIn = playerTags().filter(t=>w.att.includes(t)||w.def.includes(t));
    const aiLeaderWinning = s>0 ? A : D; const losing = s>0? D : A; const abs=Math.abs(s);
    if (!plIn.length){
      if (abs>55 || (abs>35 && dur>540)){ const terms={annex:P.filter(p=>p.owner===losing && (w.att.includes(p.ctrl)||w.def.includes(p.ctrl)) && p.ctrl!==losing).map(p=>p.id)}; if (abs>85 && sideValue([losing])<sideValue([aiLeaderWinning])*0.3) terms.puppet=true; applyPeace(w,aiLeaderWinning,losing,terms); }
      else if (dur>600 && abs<25 && Math.random()<0.3) applyPeace(w,A,D,{white:true});
    } else for (const pl of plIn){
      if (!(pendingFor(pl).length<3 && Math.random()<0.35 && !G.pendingEvents.some(e=>e.war===w.id&&e.tag===pl))) continue;
      const pSide = w.att.includes(pl)?"att":"def"; const pScore = pSide==="att"? s : -s;
      const enemyLeader = pSide==="att"? D : A; if (C[enemyLeader].isPlayer) continue;
      const myLeader = pSide==="att"? A : D; if (myLeader!==pl) continue;
      if (pScore<-45){ const annex=P.filter(p=>p.owner===pl && p.ctrl!==pl && (w.att.includes(p.ctrl)||w.def.includes(p.ctrl))).map(p=>p.id); if (annex.length) pushPending(pl,{type:"peaceDemand",war:w.id,from:enemyLeader,annex}); }
      else if (pScore>45){ const annex=P.filter(p=>p.owner===enemyLeader && p.ctrl===pl).map(p=>p.id); if (annex.length) pushPending(pl,{type:"peaceOffer",war:w.id,from:enemyLeader,annex}); }
      else if (dur>720 && Math.abs(pScore)<20) pushPending(pl,{type:"whiteOffer",war:w.id,from:enemyLeader});
    }
  }
}

const FLAG_CACHE = new Map();
function flagDefOf(c){ return c ? (c.flag || "mono:"+c.color+":"+c.tag) : "s:#555"; }
function drawStar(ctx,cx,cy,r,col,pts=5){ ctx.fillStyle=col; ctx.beginPath(); for (let i=0;i<pts*2;i++){ const rr=i%2?r*0.45:r; const a=-Math.PI/2+i*Math.PI/pts; ctx.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); }
function drawFlag(ctx,def,w,h){
  const parts=def.split("|"); const base=parts[0];
  const [kind, rest] = [base.split(":")[0], base.slice(base.indexOf(":")+1)];
  ctx.save();
  if (kind==="uae"){ ctx.fillStyle="#00732f"; ctx.fillRect(0,0,w,h/3); ctx.fillStyle="#ffffff"; ctx.fillRect(0,h/3,w,h/3); ctx.fillStyle="#000000"; ctx.fillRect(0,2*h/3,w,h/3+1); ctx.fillStyle="#ff0000"; ctx.fillRect(0,0,w*0.25,h); }
  else if (kind==="usa"){ for (let i=0;i<13;i++){ ctx.fillStyle=i%2?"#ffffff":"#b22234"; ctx.fillRect(0,i*h/13,w,h/13+1); } ctx.fillStyle="#3c3b6e"; ctx.fillRect(0,0,w*0.4,h*7/13); ctx.fillStyle="#fff"; for (let r=0;r<5;r++) for (let c2=0;c2<6;c2++){ ctx.beginPath(); ctx.arc(w*0.4*(c2+0.5)/6, h*7/13*(r+0.5)/5, Math.max(0.6,h*0.025),0,7); ctx.fill(); } }
  else if (kind==="uk"){ ctx.fillStyle="#012169"; ctx.fillRect(0,0,w,h); ctx.strokeStyle="#fff"; ctx.lineWidth=h*0.2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(w,h); ctx.moveTo(w,0); ctx.lineTo(0,h); ctx.stroke(); ctx.strokeStyle="#c8102e"; ctx.lineWidth=h*0.07; ctx.stroke(); ctx.fillStyle="#fff"; ctx.fillRect(w*0.42,0,w*0.16,h); ctx.fillRect(0,h*0.36,w,h*0.28); ctx.fillStyle="#c8102e"; ctx.fillRect(w*0.455,0,w*0.09,h); ctx.fillRect(0,h*0.41,w,h*0.18); }
  else if (kind==="qat"){ ctx.fillStyle="#8a1538"; ctx.fillRect(0,0,w,h); ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(w*0.3,0); for(let i=0;i<9;i++){ ctx.lineTo(w*0.4,h*(i+0.5)/9); ctx.lineTo(w*0.3,h*(i+1)/9); } ctx.lineTo(0,h); ctx.fill(); }
  else if (kind==="bhr"){ ctx.fillStyle="#ce1126"; ctx.fillRect(0,0,w,h); ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(w*0.25,0); for(let i=0;i<5;i++){ ctx.lineTo(w*0.38,h*(i+0.5)/5); ctx.lineTo(w*0.25,h*(i+1)/5); } ctx.lineTo(0,h); ctx.fill(); }
  else if (kind==="h"||kind==="v"){ const cols=rest.split(","); const n=cols.length; for (let i=0;i<n;i++){ ctx.fillStyle=cols[i]; if (kind==="h") ctx.fillRect(0,i*h/n,w,h/n+1); else ctx.fillRect(i*w/n,0,w/n+1,h); } }
  else if (kind==="s"){ ctx.fillStyle=rest; ctx.fillRect(0,0,w,h); }
  else if (kind==="nordic"||kind==="nordic3"){ const cols=rest.split(","); ctx.fillStyle=cols[0]; ctx.fillRect(0,0,w,h); ctx.fillStyle=cols[1]; const t=h*(kind==="nordic3"?0.26:0.2); ctx.fillRect(w*0.3,0,t,h); ctx.fillRect(0,h/2-t/2,w,t); if (kind==="nordic3"){ ctx.fillStyle=cols[2]; const t2=t*0.5; ctx.fillRect(w*0.3+t/2-t2/2,0,t2,h); ctx.fillRect(0,h/2-t2/2,w,t2);} }
  else if (kind==="mono"){ const [col,tag]=rest.split(":"); ctx.fillStyle=col; ctx.fillRect(0,0,w,h); ctx.fillStyle="rgba(0,0,0,0.25)"; ctx.fillRect(0,h*0.72,w,h*0.28); ctx.fillStyle="#fff"; ctx.font="bold "+Math.round(h*0.42)+"px system-ui,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText((tag||"").slice(0,3),w/2,h*0.42); }
  else { ctx.fillStyle="#666"; ctx.fillRect(0,0,w,h); }
  for (const ex of parts.slice(1)){
    const [k,col,txt]=ex.split(":");
    if (k==="star") drawStar(ctx,w*0.5,h*0.5,h*0.28,col);
    else if (k==="stars2"){ drawStar(ctx,w*0.38,h*0.5,h*0.12,col); drawStar(ctx,w*0.62,h*0.5,h*0.12,col); }
    else if (k==="sun"||k==="circle"){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(w*0.5,h*0.5,h*(k==="sun"?0.3:0.18),0,7); ctx.fill(); }
    else if (k==="ring"){ ctx.fillStyle=col; for (let i=0;i<12;i++){ const a=i*Math.PI/6; drawStar(ctx,w/2+Math.cos(a)*h*0.3,h/2+Math.sin(a)*h*0.3,h*0.05,col); } }
    else if (k==="crescent"){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(w*0.45,h*0.5,h*0.25,0,7); ctx.fill(); ctx.globalCompositeOperation="destination-out"; ctx.beginPath(); ctx.arc(w*0.5,h*0.5,h*0.2,0,7); ctx.fill(); ctx.globalCompositeOperation="source-over"; drawStar(ctx,w*0.62,h*0.5,h*0.09,col); }
    else if (k==="tri"){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(w*0.38,h/2); ctx.lineTo(0,h); ctx.fill(); }
    else if (k==="band"){ ctx.fillStyle=col; ctx.fillRect(0,0,w*0.25,h); }
    else if (k==="canton"){ ctx.fillStyle=col; ctx.fillRect(0,0,w*0.42,h*0.5); }
    else if (k==="cross"){ ctx.fillStyle=col; ctx.fillRect(w*0.42,h*0.2,w*0.16,h*0.6); ctx.fillRect(w*0.3,h*0.4,w*0.4,h*0.2); }
    else if (k==="diamond"){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(w*0.1,h/2); ctx.lineTo(w/2,h*0.1); ctx.lineTo(w*0.9,h/2); ctx.lineTo(w/2,h*0.9); ctx.fill(); }
    else if (k==="diag"){ ctx.strokeStyle=col; ctx.lineWidth=h*0.25; ctx.beginPath(); ctx.moveTo(0,h); ctx.lineTo(w,0); ctx.stroke(); }
    else if (k==="text"){ ctx.fillStyle=col; ctx.font="bold "+Math.round(h*0.4)+"px Georgia,serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(txt||"",w/2,h/2); }
  }
  ctx.restore();
}

function focusCountry(tag){ const own=ownedProvs(tag); if(!own.length) return; let b=[1e9,1e9,-1e9,-1e9]; for (const p of own){ b[0]=Math.min(b[0],p.bbox[0]); b[1]=Math.min(b[1],p.bbox[1]); b[2]=Math.max(b[2],p.bbox[2]); b[3]=Math.max(b[3],p.bbox[3]); }
  V.cx=(b[0]+b[2])/2; V.cy=(b[1]+b[3])/2; V.z=Math.min(60, Math.max(V.W/360, Math.min(V.W/((b[2]-b[0])*1.6+2), V.H/((b[3]-b[1])*1.6+2)))); clampView(); dirty=true; }
function clampView(){ const minZ=Math.max(V.W/380,V.H/200)*0.9; V.z=Math.max(minZ,Math.min(140,V.z)); V.cx=Math.max(-185,Math.min(185,V.cx)); V.cy=Math.max(-150,Math.min(80,V.cy)); }

function buildEdges(){ // shared voronoi edges between provinces inside the same region
  EDGES=[]; const key=(x,y)=>Math.round(x*1e4)+","+Math.round(y*1e4);
  for (const reg of REGIONS){ if (reg.provs.length<2) continue; const vmap=new Map();
    for (const id of reg.provs){ const poly=P[id].cell; for (let i=0;i<poly.length;i++){ const a=poly[i], b=poly[(i+1)%poly.length]; const k1=key(a[0],a[1]), k2=key(b[0],b[1]); const k=k1<k2?k1+"|"+k2:k2+"|"+k1; const e=vmap.get(k); if (e){ e.b=id; } else vmap.set(k,{a:id,b:-1,x1:a[0],y1:a[1],x2:b[0],y2:b[1],r:reg.idx}); } }
    for (const e of vmap.values()) if (e.b>=0 && e.b!==e.a) EDGES.push(e); }
}

function armyScreenPos(a){
  let x=P[a.prov].x, y=P[a.prov].y, dir=0;
  if (a.path.length && a.eLen && !a.battle && !a.training){ const nx=P[a.path[0]]; let tx=nx.x; if (tx-x>180) tx-=360; if (x-tx>180) tx+=360; const extra = (!G.paused && a.moving) ? a.eSpd*Math.min(1,acc) : 0; const t=Math.max(0,Math.min(1,(a.prog+extra)/a.eLen)); dir=tx-x; x=x+(tx-x)*t; y=y+(nx.y-y)*t; }
  const [sx,sy]=w2s(x,y); return [sx,sy,dir,a.path.length&&isSeaEdge(a.prov,a.path[0])];
}

let ARMY_HIT=[];
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function renderMini(){
  if (!miniCanvas) return; const w=miniCanvas.width, h=miniCanvas.height, ctx=minictx; ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle="#0b1a2e"; ctx.fillRect(0,0,w,h);
  const sx=w/360, sy=h/(165); ctx.setTransform(sx,0,0,sy,180*sx,140*sy);
  for (const reg of REGIONS){ ctx.save(); ctx.clip(reg.path,"evenodd"); for (const id of reg.provs){ ctx.fillStyle=displayColor(P[id].owner); ctx.fill(P[id].path); } ctx.restore(); }
  MINI_IMG = ctx.getImageData(0,0,w,h);

}
let MINI_IMG=null;
function drawMiniViewport(){ if (!MINI_IMG) return; const ctx=minictx, w=miniCanvas.width, h=miniCanvas.height; ctx.setTransform(1,0,0,1,0,0); ctx.putImageData(MINI_IMG,0,0); const sx=w/360, sy=h/165; const [x0,y0]=s2w(0,0),[x1,y1]=s2w(V.W,V.H); ctx.strokeStyle="#ffd56a"; ctx.lineWidth=1.5; ctx.strokeRect((x0+180)*sx,(y0+140)*sy,(x1-x0)*sx,(y1-y0)*sy); }

// ---------- HIT TEST ----------
let hitCtx=null;
function provAt(wx,wy){
  if (!hitCtx) hitCtx=document.createElement("canvas").getContext("2d");
  for (const reg of REGIONS){ const b=reg.bbox; if (wx<b[0]||wx>b[2]||wy<b[1]||wy>b[3]) continue; if (hitCtx.isPointInPath(reg.path,wx,wy,"evenodd")) return nearestProvInRegion(reg,wx,wy); }
  return -1;
}
function armyAt(sx,sy){ for (let i=ARMY_HIT.length-1;i>=0;i--){ const h=ARMY_HIT[i]; if (sx>=h.x0-3&&sx<=h.x1+3&&sy>=h.y0-3&&sy<=h.y1+3) return h.a; } return null; }

// ---------- INPUT ----------
function attachInput(){
  const el=mapCanvas; const pts=new Map(); let drag=null, pinch=null, moved=false, downT=0;
  el.addEventListener("pointerdown",e=>{ el.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY}); moved=false; downT=Date.now();
    if (pts.size===1) drag={x:e.offsetX,y:e.offsetY,cx:V.cx,cy:V.cy};
    if (pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:V.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,cx:V.cx,cy:V.cy}; drag=null; } });
  el.addEventListener("pointermove",e=>{
    if (pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
    if (pinch && pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const nz=pinch.z*d/pinch.d; const [wx,wy]=[(pinch.mx-V.W/2)/pinch.z+pinch.cx,(pinch.my-V.H/2)/pinch.z+pinch.cy]; V.z=nz; clampView(); const mx=(a.x+b.x)/2,my=(a.y+b.y)/2; V.cx=wx-(mx-V.W/2)/V.z; V.cy=wy-(my-V.H/2)/V.z; clampView(); moved=true; dirty=true; drawMiniViewport(); return; }
    if (drag){ const dx=e.offsetX-drag.x, dy=e.offsetY-drag.y; if (Math.abs(dx)+Math.abs(dy)>5) moved=true; if (moved){ V.cx=drag.cx-dx/V.z; V.cy=drag.cy-dy/V.z; clampView(); dirty=true; drawMiniViewport(); } return; }
    if (e.pointerType==="mouse"){ const [wx,wy]=s2w(e.offsetX,e.offsetY); const pid=provAt(wx,wy); hoverArmy=armyAt(e.offsetX,e.offsetY); if (pid!==hoverProv){ hoverProv=pid; dirty=true; } ui.tooltip(e.clientX,e.clientY,pid,hoverArmy); }
  });
  const up=e=>{ pts.delete(e.pointerId); if (pts.size<2) pinch=null; if (pts.size===0){ if (!moved && drag) click(e); drag=null; } };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",e=>{pts.delete(e.pointerId); drag=null; pinch=null;});
  el.addEventListener("pointerleave",()=>{ if (hoverProv!==-1){ hoverProv=-1; dirty=true; } ui.tooltip(0,0,-1,null); });
  el.addEventListener("wheel",e=>{ e.preventDefault(); zoomAt(e.offsetX,e.offsetY, Math.exp(-e.deltaY*0.0015)); },{passive:false});
  el.addEventListener("contextmenu",e=>{ e.preventDefault(); const [wx,wy]=s2w(e.offsetX,e.offsetY); const pid=provAt(wx,wy); if (pid>=0) ui.rightClick(pid); });
  miniCanvas.addEventListener("pointerdown",e=>{ const r=miniCanvas.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*360-180, y=(e.clientY-r.top)/r.height*165-140; V.cx=x; V.cy=y; clampView(); dirty=true; drawMiniViewport(); });
  function click(e){ const sx=e.offsetX, sy=e.offsetY; const a=armyAt(sx,sy); const [wx,wy]=s2w(sx,sy); const pid=provAt(wx,wy); ui.mapClick(pid,a,e); }
}
function zoomAt(sx,sy,f){ const [wx,wy]=s2w(sx,sy); V.z*=f; clampView(); V.cx=wx-(sx-V.W/2)/V.z; V.cy=wy-(sy-V.H/2)/V.z; clampView(); dirty=true; drawMiniViewport(); }

// ---------- audio ----------
let AC=null, musicNode=null;
function audio(){ if (!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } return AC; }
function tone(f,d,type="sine",vol=0.06,delay=0){ const a=audio(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,a.currentTime+delay); g.gain.linearRampToValueAtTime(vol,a.currentTime+delay+0.01); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+delay+d); o.connect(g); g.connect(a.destination); o.start(a.currentTime+delay); o.stop(a.currentTime+delay+d+0.05); }
function sfx(k){ if (!G||!G.settings.sound) return; try{
  if (k==="click") tone(660,0.06,"triangle",0.03);
  else if (k==="war"){ tone(110,0.5,"sawtooth",0.06); tone(82,0.7,"square",0.04,0.15); tone(110,0.4,"sawtooth",0.05,0.45); }
  else if (k==="capture"){ tone(523,0.15,"triangle",0.05); tone(659,0.15,"triangle",0.05,0.12); tone(784,0.3,"triangle",0.05,0.24); }
  else if (k==="lose"){ tone(392,0.2,"triangle",0.05); tone(311,0.35,"triangle",0.05,0.18); }
  else if (k==="build"||k==="tech"){ tone(880,0.1,"sine",0.04); tone(1175,0.18,"sine",0.04,0.08); }
  else if (k==="peace"){ tone(523,0.4,"sine",0.04); tone(659,0.4,"sine",0.04,0.1); tone(784,0.6,"sine",0.04,0.2); }
  else if (k==="form"){ [523,659,784,1046].forEach((f,i)=>tone(f,0.5,"triangle",0.06,i*0.18)); tone(1046,1.2,"sine",0.05,0.8); }
  else if (k==="nuke"){ tone(60,2.5,"sawtooth",0.1); tone(45,3,"square",0.06,0.2); }
  else if (k==="notify") tone(740,0.12,"sine",0.03);
}catch(e){} }
function setMusic(on){ const a=audio(); if (!a) return; if (musicNode){ try{ musicNode.stop(); }catch(e){} musicNode=null; } if (!on) return;
  const chords=[[220,277,330],[196,247,294],[175,220,262],[196,247,294]]; let i=0; let stopped=false;
  const play=()=>{ if (stopped||!G||!G.settings.music) return; const ch=chords[i++%chords.length]; ch.forEach(f=>{ const o=a.createOscillator(), g=a.createGain(); o.type="sine"; o.frequency.value=f/2; g.gain.setValueAtTime(0,a.currentTime); g.gain.linearRampToValueAtTime(0.018,a.currentTime+1.5); g.gain.linearRampToValueAtTime(0,a.currentTime+5.8); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+6); }); setTimeout(play,6000); };
  musicNode={stop:()=>{stopped=true;}}; play(); }

// ---------- game loop ----------
function startLoop(){ if (loopTimer) clearInterval(loopTimer); lastTick=performance.now(); acc=0; loopTimer=setInterval(()=>{
  const now=performance.now(); const dt=(now-lastTick)/1000; lastTick=now; if (!G||G.paused||CHOOSING) { acc=0; return; }
  if (hasOwnPending() && !$("#modal").classList.contains("show")) { showPending(); if (!MPClient()) return; }
  if (MPClient()){ acc=Math.min(1,(now-(MP.lastLight||now))/1000*SPEEDS[G.speed]); return; }
  if ($("#modal").classList.contains("show") && $("#modal").dataset.blocking==="1") return;
  acc += dt*SPEEDS[G.speed]; let n=0; while (acc>=1 && n<4){ acc-=1; n++; dailyTick(); if (hasOwnPending()) { break; } }
  if (acc>4) acc=0;
  if (n){ mapDirty(false); }
}, 50);
  setInterval(()=>{ if (G && $("#play").style.display!=="none"){ updateTop(); if (PANEL && PANEL.live) refreshPanel(); } }, 400);
}
function setSpeed(s){ if (!G) return; if (s===0){ G.paused=!G.paused; } else { G.speed=s; G.paused=false; } updateTop(); }

PANELS.research = ()=>{

  let h='<div class="grid2">'+stat("Research speed",(c.rpDay||rpPerDay(c)).toFixed(1)+" / day")+stat("Technologies",Object.keys(c.techs).length+" / "+Object.keys(TECHS).length)+'</div><h4>Active research</h4>';
  c.research.forEach((r,i)=>{ h+= r? '<div class="qrow">🔬 <b>'+TECHS[r.id][0]+'</b> '+bar(r.prog,TECHS[r.id][2])+'<small>'+Math.ceil((TECHS[r.id][2]-r.prog)/Math.max(0.1,c.rpDay||1))+' days</small><button class="x" data-a="cancelRes" data-v="'+i+'">✕</button></div>' : '<div class="qrow muted">Slot '+(i+1)+': idle — pick a technology below</div>'; });
  h+='<div class="ttree">';
  for (const cat of TECH_CATS){ h+='<div class="tcol"><h4>'+cat+'</h4>';
    for (const id in TECHS){ const t=TECHS[id]; if (t[1]!==cat) continue; const done=c.techs[id]; const act=c.research.some(r=>r&&r.id===id); const avail=t[3].every(q=>c.techs[q]);
      h+='<button class="tech '+(done?'done':act?'act':avail?'avail':'lock')+'" data-a="research" data-v="'+id+'"><b>'+t[0]+'</b><small>'+t[4]+'</small><small class="tc">'+(done?"✔ Researched":act?"In progress":(avail?"🔬 "+t[2]:"🔒 needs "+t[3].filter(q=>!c.techs[q]).map(q=>TECHS[q][0]).join(", ")))+'</small></button>'; }
    h+='</div>'; }
  h+='</div>'; return ["🔬 Research",h];
};
PANELS.diplomacy = ()=>{
  const pl=G.player; const c=C[pl]; if(!c) return ["Diplomacy",""];
  const al=allianceOf(pl);
  let h='<div class="grid2">'+stat("Influence",Math.floor(c.di)+" (+"+diPerMonth(c).toFixed(1)+"/mo)")+stat("Faction",al?esc(al.name):"None")+'</div>';
  if (al) h+='<div class="chips">'+al.members.map(t=>'<span class="chip" data-a="panel" data-v="country:'+t+'">'+flagImg(C[t])+esc(C[t].name)+'</span>').join("")+'</div>';
  h+='<input class="search" id="dsearch" placeholder="Search countries…" data-a="dsearch" value="'+esc(UIState.dq||"")+'">';
  const nb=new Set(neighborsOf(pl).concat(seaNeighborsOf(pl)));
  let list=Object.values(C).filter(x=>x.alive&&x.tag!==pl);
  if (UIState.dq) list=list.filter(x=>x.name.toLowerCase().includes(UIState.dq.toLowerCase())); else list=list.filter(x=>nb.has(x.tag)||Math.abs(getRel(pl,x.tag))>20||x.gdp>800||isAlly(pl,x.tag)||atWar(pl,x.tag));
  list.sort((a,b)=>(atWar(pl,b.tag)-atWar(pl,a.tag))||(getRel(pl,b.tag)-getRel(pl,a.tag)));
  h+='<div class="clist">'+list.slice(0,80).map(x=>{ const r=getRel(pl,x.tag); return '<div class="crow" data-a="panel" data-v="country:'+x.tag+'">'+flagImg(x)+'<span><b>'+esc(x.name)+'</b><small>'+(atWar(pl,x.tag)?'<span class="neg">At war</span> · ':'')+(isAlly(pl,x.tag)?'<span class="pos">Ally</span> · ':'')+(nb.has(x.tag)?'Neighbor · ':'')+'$'+fmtB(x.gdp)+'</small></span><b style="color:'+relCol(r)+'">'+Math.round(r)+'</b></div>'; }).join("")+'</div>';
  if (!UIState.dq) h+='<p class="hint">Showing neighbors, major powers and countries with strong relations. Search to find any country.</p>';
  return ["🤝 Diplomacy",h];
};
const UIState={dq:"",rank:"gdp",cmp:[]};
const TERRAIN_ICONS={plains:"🌾",hills:"⛰️",forest:"🌲",desert:"🏜️",jungle:"🌴",mountain:"🏔️",tundra:"❄️"};
PANELS.politics = ()=>{
  const c=C[G.player]; if(!c) return ["Politics",""];
  let h='<div class="grid2">'+stat("Government",govOf(c).name)+stat("Next election",govOf(c).elections?dateStr(c.nextElection):"—")+'</div>';
  h+='<h4>Stability '+Math.round(c.stability)+'%</h4>'+bar(c.stability,100,c.stability>50?"#4ade80":c.stability>25?"#facc15":"#ef4444")+'<h4>Government approval '+Math.round(c.approval)+'%</h4>'+bar(c.approval,100,"#60a5fa")+'<h4>War exhaustion '+Math.round(c.warExh)+'%</h4>'+bar(c.warExh,100,"#ef4444");
  h+='<p class="hint">Low stability (&lt;35) causes protests; below 18 dictatorships risk coups; below 10 civil war can erupt.</p>';
  h+='<h4>Laws</h4>';
  for (const l in LAWS){ h+='<label class="law"><span>'+LAWS[l].name+'</span><select data-a="law" data-v="'+l+'">'+LAWS[l].opts.map((o,i)=>'<option value="'+i+'"'+(c.laws[l]===i?' selected':'')+'>'+o[0]+'</option>').join("")+'</select></label>'; }
  h+='<p class="hint">Conscription: manpower ×'+lawOpt(c,"conscription")[1]+'. War Economy speeds recruitment but slows growth. Free Trade boosts trade income.</p>';
  h+='<h4>Change government</h4><div class="dgrid">'+Object.entries(GOVS).filter(([k])=>k!==c.gov).map(([k,g])=>'<button class="dbtn" data-a="gov" data-v="'+k+'"><b>'+g.name+'</b><small>Stability '+(g.stab>=0?"+":"")+g.stab+' · tax ×'+g.tax+' · growth ×'+g.growth+(g.elections?' · elections':'')+'</small></button>').join("")+'</div><p class="hint">Changing government costs 15 stability and 10 approval and can only be done once a year.</p>';
  return ["🏛️ Politics",h];
};
PANELS.gov = arg=>{ const t=arg||"politics"; const [ti,body]=(t==="decisions"?PANELS.decisions():PANELS.politics()); return ["🏛️ Government", tabbed("gov",[["politics","Politics & laws"],["decisions","Decisions"]],t)+body]; };
PANELS.world = arg=>{ const t=arg||"rank"; let body; if (t==="trade") body=PANELS.trade()[1]; else body=PANELS.stats(t)[1].replace(/^<div class="tabs">[\s\S]*?<\/div>/,""); return ["🌍 World", tabbed("world",[["rank","Rankings"],["compare","Compare"],["trade","Trade"],["world","Wars & alliances"],["news","News"]],t)+body]; };
function advice(){
  const pl=G.player; if (!pl) return []; const c=C[pl]; const L=[]; const add=(icon,text,btns,pri)=>L.push({icon,text,btns:btns||"",pri:pri||0});
  const btn=(label,a,v,extra)=>'<button class="btn sm2 gold" data-a="'+a+'"'+(v!==undefined?' data-v="'+v+'"':'')+(extra||'')+'>'+label+'</button>';
  if (G.paused && G.day<3) add("▶️","Time is paused. Press play to start the game.",btn("Start","speed","1"),100);
  const wars=warsOf(pl);
  for (const w of wars){ const en=w.att.includes(pl)?w.def:w.att; const s=scoreFor(w,pl); const auto=G.armies.some(a=>a.owner===pl&&a.auto);
    add("⚔️","You are at war with "+en.map(t=>esc(C[t].name)).join(", ")+". War score "+(s>=0?"+":"")+Math.round(s)+(s>40?" — you're winning, you could demand peace.":s<-30?" — you're losing! Consider peace.":"."), (auto?"":en.slice(0,2).map(t=>btn("Capture "+esc(C[t].name),"invade",t)).join(""))+btn(s>20?"Demand peace":"Peace talks","peaceUI",w.id,' data-t="'+(w.att.includes(pl)?w.leaderD:w.leaderA)+'"'),90); }
  for (const pid in G.battles){ const b=G.battles[pid]; const mine = b.A===pl||isAlly(b.A,pl)&&atWar(b.B,pl) ? "A" : (b.B===pl||isAlly(b.B,pl)&&atWar(b.A,pl)) ? "B" : null; if (!mine) continue; const my=mine==="A"?b.PA:b.PB, th=mine==="A"?b.PB:b.PA; add(my>th?"🟢":"🔴","Battle at "+esc(P[pid].name)+": your power "+fmtN(my)+" vs "+fmtN(th)+" — "+(my>th?"you are winning.":"you are losing! Send reinforcements or retreat."),btn("Show","gotoProv",pid),80); }
  const cap=P[c.capital]; if (cap && cap.adj.some(q=>G.armies.some(b=>b.prov===q&&atWar(b.owner,pl)))) add("🚨","Enemy troops are next to your capital "+esc(cap.name)+"!",btn("Show","gotoProv",cap.id),95);
  if (c.research.some(r=>!r)) add("🔬","You have a free research slot. Pick a technology to unlock better units and bonuses.",btn("Research","panel","research"),60);
  const slots=2+Math.floor(countBld(pl,"factory")/4); const own=ownedProvs(pl).filter(p=>p.ctrl===pl);
  if (c.buildQ.length<slots && c.treasury>bCost(c,"factory")*1.5){ const best=own.filter(p=>(p.bld.factory||0)+c.buildQ.filter(q=>q.prov===p.id&&q.b==="factory").length<5).sort((a,b)=>provGDP(b)-provGDP(a))[0]; if (best) add("🏭","You have money and free builders. A Factory in "+esc(best.name)+" will grow your economy.",btn("Build factory ($"+fmtB(bCost(c,"factory"))+")","build","factory",' data-p="'+best.id+'"'),50); }
  if (c.net+(c.income.market||0)<0) add("📉","You are losing money every month. Raise taxes a little or disband some troops.",btn("Economy","panel","economy"),85);
  if (c.stability<40) add("😟","Stability is low ("+Math.round(c.stability)+"%). Low stability can cause protests, coups and civil war.",btn("Government","panel","gov:decisions"),75);
  const land=G.armies.filter(a=>a.owner===pl).reduce((s,a)=>s+landSize(a),0);
  if (c.manpower>20000 && c.treasury>uCost(c,"inf")*10 && land<5+Math.sqrt(c.gdp)*0.5){ const k=c.techs.armor2&&countBld(pl,"milfac")?"tank":"inf"; add("🪖","Your army is small for your country. Recruit more troops to be safe.",btn("Recruit 10 "+UNITS[k].name,"quickRecruit",k),40); }
  if (!wars.length){ const nb=neighborsOf(pl).filter(t=>C[t]&&C[t].alive&&!isAlly(pl,t)); const weak=nb.filter(t=>milStrength(t)*1.5<milStrength(pl)).sort((a,b)=>milStrength(a)-milStrength(b))[0]; if (weak) add("🎯",esc(C[weak].name)+" is a weaker neighbor (power "+fmtN(milStrength(weak))+" vs your "+fmtN(milStrength(pl))+"). You could expand by conquering it.",btn("View "+esc(C[weak].name),"panel","country:"+weak),20);
    const friend=nb.filter(t=>getRel(pl,t)>45&&!allianceOf(t)).sort((a,b)=>getRel(pl,b)-getRel(pl,a))[0]; if (friend) add("🤝",esc(C[friend].name)+" likes you. An alliance means they defend you and join your wars.",btn("Propose alliance","diplo","alliance",' data-t="'+friend+'"'),25); }
  const fm=Object.entries(FORMABLES).map(([id,f])=>[id,f,formableProgress(pl,f)]).filter(([id,f,p])=>p.total&&p.have>0&&!c.formed.includes(id)).sort((a,b)=>b[2].have/b[2].total-a[2].have/a[2].total)[0];
  if (fm){ if (canForm(pl,fm[0])) add("👑","You can proclaim the "+fm[1].name+"!",btn("Proclaim","form",fm[0]),70); else add("👑","Closest empire: "+fm[1].name+" ("+fm[2].have+"/"+fm[2].total+" provinces). Missing: "+fm[2].missing.slice(0,4).map(t=>esc(CDATA[t]?CDATA[t].name:t)).join(", ")+(fm[2].missing.length>4?"…":""),btn("Empires","panel","formables"),10); }
  if (!L.length) add("✅","Everything looks good. Keep growing your nation!","",0);
  return L.sort((a,b)=>b.pri-a.pri);
}
PANELS.advisor = ()=>{ const L=advice(); return ["💡 Advisor",'<p class="muted">Your advisor suggests what to do next. Tap a button to do it right away.</p>'+L.map(x=>'<div class="adv"><span class="ai">'+x.icon+'</span><div><p>'+x.text+'</p>'+(x.btns?'<div class="row">'+x.btns+'</div>':'')+'</div></div>').join("")]; };
PANELS.decisions = ()=>{
  const c=C[G.player]; if(!c) return ["Decisions",""];
  let h='<p class="muted">National decisions have powerful permanent or immediate effects.</p>';
  for (const id in DECISIONS){ const d=DECISIONS[id]; const st=c.decisions[id]||{n:0,last:-99999}; const cost=d.cost(c); const cd=Math.max(0,st.last+d.cd-G.day); const blocked = (d.req&&!c.techs[d.req])? "Requires "+TECHS[d.req][0] : st.n>=d.max? "Already enacted" : cd>0? "Available in "+cd+" days" : c.treasury<cost? "Not enough money" : (d.di&&c.di<d.di)? "Not enough influence" : null;
    h+='<div class="dec'+(blocked?' dis':'')+'"><div><b>'+d.name+'</b><small>'+d.desc+'</small><small class="gold">'+(cost>0?'Cost: $'+fmtB(cost):'')+(d.di?' 🕊️ '+d.di:'')+(d.max<99&&d.max>1?' · '+st.n+'/'+d.max:'')+'</small>'+(blocked?'<small class="neg">'+blocked+'</small>':'')+'</div>'+(blocked?'':'<button class="btn gold sm" data-a="decision" data-v="'+id+'">Enact</button>')+'</div>'; }
  return ["📜 Decisions",h];
};
function spark(arr,w=80,h=22,col="#d4af37"){ if (!arr||arr.length<2) return ""; const mn=Math.min(...arr), mx=Math.max(...arr); const pts=arr.map((v,i)=>(i/(arr.length-1)*w).toFixed(1)+","+(h-(v-mn)/((mx-mn)||1)*h).toFixed(1)).join(" "); return '<svg width="'+w+'" height="'+h+'" class="spark"><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5"/></svg>'; }
PANELS.trade = ()=>{
  const c=C[G.player]; const mk=G.market;
  let h='<h4>Global market</h4><table class="tbl"><tr><th>Resource</th><th>Price</th><th>Trend</th><th>World supply/demand</th>'+(c?'<th>Trade</th>':'')+'</tr>';
  for (const k of RES_KEYS){ const pr=mk.price[k]; const base=RES_BASE_PRICE[k]; h+='<tr><td><i class="dot" style="background:'+RES_COLORS[k]+'"></i>'+RES_NAMES[k]+'</td><td class="'+(pr>base*1.1?'neg':pr<base*0.9?'pos':'')+'">$'+(pr).toFixed(2)+'B</td><td>'+spark(mk.hist[k])+'</td><td><small>'+(mk.supply[k]||0).toFixed(0)+' / '+(mk.demand[k]||0).toFixed(0)+'</small></td>'+(c?'<td class="nowrap"><button class="btn xs" data-a="buy" data-v="'+k+'">Buy 1</button><button class="btn xs" data-a="sell" data-v="'+k+'">Sell 1</button></td>':'')+'</tr>'; }
  h+='</table>';
  if (c){ h+='<label class="law"><span>Automatic trading (sell surplus, buy shortages)</span><select data-a="autoTrade"><option value="1"'+(G.settings.autoTrade!==false?' selected':'')+'>On</option><option value="0"'+(G.settings.autoTrade===false?' selected':'')+'>Off</option></select></label>';
    h+='<div class="grid2">'+stat("Your exports","$"+fmtB(c.exports||0)+"/mo")+stat("Your imports","$"+fmtB(c.imports||0)+"/mo")+stat("Trade agreements",Object.keys(c.tradeAg).length+" / 8")+stat("Trade policy",lawOpt(c,"trade")[0])+'</div>';
    if (Object.keys(c.tradeAg).length) h+='<div class="chips">'+Object.keys(c.tradeAg).filter(t=>C[t]).map(t=>'<span class="chip" data-a="panel" data-v="country:'+t+'">'+flagImg(C[t])+esc(C[t].name)+'</span>').join("")+'</div>'; }
  const alive=Object.values(C).filter(x=>x.alive&&x.prod);
  h+='<h4>Top producers</h4><div class="grid2">'+["oil","gas","steel","food","rare","uranium"].map(k=>{ const top=alive.slice().sort((a,b)=>b.prod[k]-a.prod[k]).slice(0,3); return '<div class="stat"><span>'+RES_NAMES[k]+'</span><b class="small">'+top.map(x=>esc(x.name.length>14?x.tag:x.name)).join(", ")+'</b></div>'; }).join("")+'</div>';
  h+='<h4>Biggest exporters</h4>'+alive.slice().sort((a,b)=>(b.exports||0)-(a.exports||0)).slice(0,5).map((x,i)=>'<div class="qrow">'+(i+1)+'. '+flagImg(x)+' '+esc(x.name)+' <b class="pos">$'+fmtB(x.exports||0)+'/mo</b></div>').join("");
  h+='<h4>Biggest importers</h4>'+alive.slice().sort((a,b)=>(b.imports||0)-(a.imports||0)).slice(0,5).map((x,i)=>'<div class="qrow">'+(i+1)+'. '+flagImg(x)+' '+esc(x.name)+' <b class="neg">$'+fmtB(x.imports||0)+'/mo</b></div>').join("");
  return ["📈 Trade",h];
};
PANELS.formables = ()=>{

  const list=Object.entries(FORMABLES).map(([id,f])=>[id,f,pl?formableProgress(pl,f):{have:0,total:1}]).sort((a,b)=>(b[2].have/(b[2].total||1))-(a[2].have/(a[2].total||1)));
  for (const [id,f,pr] of list){ if (!pr.total) continue; const done=pl&&C[pl].formed.includes(id); const can=pl&&canForm(pl,id); const pct=pr.have/pr.total*100;
    h+='<div class="form'+(done?' done':can?' ready':'')+'"><div class="fh">'+'<img class="flag big" src="'+flagURL(f.flag)+'"><div><b>'+f.name+'</b><small>'+f.desc+'</small></div></div>'+bar(pct,100,can?"#d4af37":"#60a5fa")+'<small>'+pr.have+' / '+pr.total+' provinces · Reward: '+f.bonusText+'</small><div class="chips sm">'+pr.reqTags.map(t=>{ const owned = P.filter(p=>p.core===t).every(p=>p.owner===pl); return '<span class="chip'+(owned?' green':'')+'">'+(owned?'✔ ':'')+esc(CDATA[t]?CDATA[t].name:t)+'</span>'; }).join("")+'</div>'+(done?'<b class="gold">✔ Formed</b>':can?'<button class="btn gold" data-a="form" data-v="'+id+'">👑 Proclaim '+f.name+'</button>':'')+'</div>'; }
  return ["👑 Formable Nations",h];
};
PANELS.stats = arg=>{

function histChart(tags,idx){ const W=320,H=120; let mx=0, d0=Infinity, d1=0; for (const t of tags) for (const r of C[t].history){ mx=Math.max(mx,r[idx]); d0=Math.min(d0,r[0]); d1=Math.max(d1,r[0]); } if (!mx||d1<=d0) return '<p class="muted">Not enough history yet — check back after a few months.</p>';
  const cols=["#d4af37","#60a5fa","#f87171"]; let s='<svg viewBox="0 0 '+W+' '+H+'" class="hchart"><line x1="0" y1="'+(H-1)+'" x2="'+W+'" y2="'+(H-1)+'" stroke="#334"/>';
  tags.forEach((t,i)=>{ const pts=C[t].history.map(r=>((r[0]-d0)/(d1-d0)*W).toFixed(1)+","+(H-4-r[idx]/mx*(H-10)).toFixed(1)).join(" "); s+='<polyline points="'+pts+'" fill="none" stroke="'+cols[i]+'" stroke-width="2"/>'; });
  return s+'</svg><div class="legend">'+tags.map((t,i)=>'<span><i style="background:'+cols[i]+'"></i>'+esc(C[t].name)+'</span>').join("")+'</div>'; }

function renderPeace(){

  armyMerge:d=>{ const a=G.armies.find(x=>x.id===+d.v); if(!a) return; let n=0; for (const b of G.armies) if (b!==a && b.owner===a.owner && b.prov===a.prov && !b.battle){ for (const k in b.units) a.units[k]=(a.units[k]||0)+b.units[k]; b.units={}; freeGeneral(b); n++; } G.armies=G.armies.filter(x=>armySize(x)>0.05); notify(n?"🔗 Merged "+n+" armies.":"No other armies here to merge.",n?"good":"info"); refreshPanel(); mapDirty(false); },

const MODES=[["political","Political"],["population","Population"],["economy","Economy"],["gdp","GDP"],["military","Military strength"],["religion","Religion"],["ideology","Government ideology"],["resource","Resources"],["diplomacy","Diplomatic relations"],["alliance","Alliances"],["infrastructure","Infrastructure"],["supply","Supply"]];
document.addEventListener("click",e=>{ const el=e.target.closest("[data-a]"); if (!el||el.tagName==="SELECT"||(el.tagName==="INPUT"&&el.type!=="checkbox")) return; const f=ACT[el.dataset.a]; if (f){ e.preventDefault(); f(el.dataset,el); } });
document.addEventListener("change",e=>{ const el=e.target.closest("[data-a]"); if (!el) return; if (el.tagName==="SELECT"||el.type==="range"){ const f=ACT[el.dataset.a]; if (f) f(el.dataset,el); } });
document.addEventListener("input",e=>{ const el=e.target; if (el.dataset && (el.dataset.a==="dsearch"||el.dataset.a==="nsearch"||el.dataset.a==="tax")){ ACT[el.dataset.a](el.dataset,el); } });
document.addEventListener("keydown",e=>{ if (!G||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; if ($("#play").style.display==="none") return; if (e.code==="Space"){ e.preventDefault(); setSpeed(0); } else if (/^Digit[1-5]$/.test(e.code)) setSpeed(+e.code.slice(5)); else if (e.code==="Escape"){ if ($("#modal").classList.contains("show") && $("#modal").dataset.blocking!=="1") closeModal(); else closePanel(); } });

const ui = { tooltip, mapClick, rightClick, formationAnim, gameOver };

// ---------- main menu ----------
function renderMenu(){
  const auto=saveMeta("auto");
  const mb=(a,ic,t,sub,cls="")=>'<button class="mbtn '+cls+'" data-a="'+a+'"><span class="mi">'+ic+'</span><span>'+t+(sub?'<br><small>'+sub+'</small>':'')+'</span></button>';
  $("#menuBtns").innerHTML = WORLD_READY ? (
    (G && !G._preview && (G.player||G.spectator) ? mb("toGame","▶️","Resume game","","gold") : mb("newGame","⚔️","Play","Choose a nation and begin","gold"))+
    (G && !G._preview && (G.player||G.spectator) ? mb("newGame","⚔️","New game","") : "")+
    mb("sandbox","🌍","Sandbox","Set AI aggression")+
    (auto?mb("continueLast","📂","Continue",esc(auto.country)):mb("loadMenu","💾","Load game",""))+
    (auto?mb("loadMenu","💾","Load game",""):"")+
    mb("multiplayer","👥","Multiplayer","Coming soon")+
    mb("settings","⚙️","Settings","")+
    mb("tutorial","❓","How to play","")+
    mb("menuStats","📊","Statistics","")+
    mb("toHub","🏠","Back to Game Hub","","ghost")) : '<div class="loading"><div class="spin"></div><span id="loadmsg">Loading world map…</span></div>'+mb("toHub","🏠","Back to Game Hub","","ghost");
}
ACT.loadMenu=()=>{ let slots=""; for (const s of ["1","2","3","auto"]){ const m=saveMeta(s); slots+='<div class="slot"><span><b>'+(s==="auto"?"Autosave":"Slot "+s)+'</b><small>'+(m?esc(m.country)+' · '+m.date:'Empty')+'</small></span>'+(m?'<button class="btn xs gold" data-a="load" data-v="'+s+'">Load</button>':'')+'</div>'; } modal('<h3>💾 Load game</h3>'+slots+'<div class="row"><button class="btn" data-a="import">📥 Import save code</button></div><div class="row end"><button class="btn" data-a="closeModal">Close</button></div>'); };

async function bootGame(){
  if (WORLD_READY || bootGame.running) return; bootGame.running=true; renderMenu();
  try {
    const {id,geo} = await loadMapData(msg=>{ const el=$("#loadmsg"); if (el) el.textContent=msg; });
    $("#loadmsg") && ($("#loadmsg").textContent="Building provinces…"); await new Promise(r=>setTimeout(r,30));
    buildWorld(geo,id); WORLD_READY=true;
    setupMap($("#map"),$("#mini"));
    $("#modes").innerHTML=MODES.map(m=>'<button data-a="mode" data-v="'+m[0]+'" class="'+(m[0]==="political"?"on":"")+'">'+m[1]+'</button>').join("");
    startLoop(); renderMenu();
    $("#mapsrc").textContent="Map data: "+(MAP_SOURCES.find(s=>s.id===id)||{}).label+" · "+REGIONS.length+" territories · "+P.length+" provinces";
  } catch(e){ console.error(e); bootGame.running=false; $("#menuBtns").innerHTML='<div class="err"><b>Could not load the world map.</b><p>'+esc(e.message)+'</p><p>Check your internet connection and try again.</p><button class="mbtn gold" onclick="bootGame()">Retry</button></div><button class="mbtn ghost" data-a="toHub">🏠 Back to Game Hub</button>'; }
}

function icon(x,cls="ico"){ if (!x) return ""; if (x[0]==="@") return '<img class="'+cls+' img" src="'+unitURL(x.slice(1))+'" alt="">'; return '<span class="'+cls+'">'+x+'</span>'; }
function ring(pct,size=46,col="#e2c25a",inner="",stroke=5){ const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct))); return '<span class="ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="rgba(255,255,255,.1)" stroke-width="'+stroke+'" fill="none"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="'+col+'" stroke-width="'+stroke+'" fill="none" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg><span class="rin">'+inner+'</span></span>'; }
function bubble(ic,val,label,cls=""){ return '<div class="bub '+cls+'"><span class="bi">'+ic+'</span><b>'+val+'</b><small>'+label+'</small></div>'; }
function face(r){ return r>60?"😍":r>25?"🙂":r>-15?"😐":r>-50?"🙁":"😡"; }
function gauge(v,label,ic,col){ return '<div class="gauge">'+ring(v/100,78,col,'<span class="gi">'+ic+'</span><b>'+Math.round(v)+'</b>',8)+'<small>'+label+'</small></div>'; }
function heroBox(ic,big,sub,extra=""){ return '<div class="hero2"><div class="hic">'+ic+'</div><div class="htx"><b>'+big+'</b><small>'+sub+'</small></div>'+extra+'</div>'; }
function enemiesOf(tag){ return [...new Set(warsOf(tag).flatMap(w=>w.att.includes(tag)?w.def:w.att))].filter(t=>C[t]&&C[t].alive); }
function invadeBanner(pl, list){ if (!list.length) return ""; const inv=G.armies.filter(a=>a.owner===pl&&a.auto).length;
  return '<div class="invban"><div class="ibh">⚔️ Invade <small>Your armies conquer automatically — and only attack where they are stronger.</small></div><div class="ibg">'+list.map(t=>'<button class="ibtn" data-a="invade" data-v="'+t+'">'+flagImg(C[t],"flag big")+'<span>Capture<br><b>'+esc(C[t].name)+'</b></span></button>').join("")+(list.length>1?'<button class="ibtn all" data-a="invade" data-v="all"><span class="bi">🌍</span><span>Capture<br><b>All enemies</b></span></button>':'')+'</div>'+(inv?'<button class="btn" data-a="stopInvade">⏹ Stop invasion ('+inv+' armies)</button>':'')+'</div>'; }

PANELS.economy = ()=>{
  const c=C[G.player]; if (!c) return ["Economy",""]; const inc=c.income; const net=c.net+(inc.market||0);
  let h=heroBox("💰","$"+fmtB(c.treasury),'<span class="'+(net>=0?'pos':'neg')+'">'+(net>=0?"▲ +":"▼ ")+fmtB(net)+' every month</span>');
  h+='<div class="bubs">'+bubble("🏭","$"+fmtB(c.gdp),"GDP / year")+bubble("💳","$"+fmtB(c.debt),"Debt",c.debt>c.gdp?"neg":"")+bubble("🎈",c.inflation.toFixed(1)+"%","Inflation",c.inflation>10?"neg":"")+'</div>';
  const ins=[["🧾","Taxes",inc.tax,"#e2c25a"],["🚢","Trade",inc.trade,"#60a5fa"],["🛢️","Resources",Math.max(0,inc.market||0),"#4ade80"]];
  const outs=[["👪","People",-inc.social,"#a78bfa"],["🪖","Army",-inc.military,"#f87171"],["🏗️","Buildings",-inc.buildings,"#fb923c"],["💳","Debt",-inc.interest,"#94a3b8"],["🛒","Imports",Math.max(0,-(inc.market||0)),"#f472b6"]];
  const tIn=ins.reduce((s,x)=>s+x[2],0), tOut=outs.reduce((s,x)=>s+x[2],0), mx=Math.max(tIn,tOut,0.001);
  const flow=(arr,t)=>'<div class="flow"><div class="fbar">'+arr.filter(x=>x[2]>0).map(x=>'<i style="width:'+(x[2]/mx*100).toFixed(1)+'%;background:'+x[3]+'" title="'+x[1]+'"></i>').join("")+'</div><div class="fleg">'+arr.filter(x=>x[2]>0.0005).map(x=>'<span><i style="background:'+x[3]+'"></i>'+x[0]+' '+fmtB(x[2])+'</span>').join("")+'</div></div>';
  h+='<div class="card"><div class="ch">⬆️ Money in <b class="pos">+'+fmtB(tIn)+'</b></div>'+flow(ins)+'<div class="ch">⬇️ Money out <b class="neg">-'+fmtB(tOut)+'</b></div>'+flow(outs)+'</div>';
  const tx=Math.round(c.tax*100); const mood=tx<=12?"😄":tx<=20?"🙂":tx<=28?"😐":tx<=36?"😠":"🤬";
  h+='<div class="card"><div class="ch">🧾 Taxes <b id="taxv">'+tx+'%</b><span class="mood" id="taxmood">'+mood+'</span></div><input type="range" min="5" max="45" value="'+tx+'" data-a="tax"><div class="scale"><span>😄 happy people</span><span>more money 💰</span></div></div>';
  // build grid
  const own=ownedProvs(c.tag).filter(p=>p.ctrl===c.tag).sort((a,b)=>provGDP(b)-provGDP(a));
  const slots=2+Math.floor(countBld(c.tag,"factory")/4);
  h+='<div class="sech">🏗️ Build <small>'+c.buildQ.length+'/'+slots+' builders busy</small></div><div class="row"><span class="muted">Where:</span><select data-a="bprov"><option value="auto">✨ Best place automatically</option>'+own.map(p=>'<option value="'+p.id+'"'+(String(UIState.bprov)===String(p.id)?' selected':'')+'>'+esc(p.name)+'</option>').join("")+'</select></div>';
  h+='<div class="tiles">'+BLD_KEYS.map(k=>{ const b=BUILDINGS[k]; const lock = b.req&&!c.techs[b.req] ? "🔒 "+TECHS[b.req][0] : c.treasury<bCost(c,k)?"Not enough money":""; return '<button class="tile'+(lock?' dis':'')+'" data-a="buildTile" data-v="'+k+'" title="'+esc(b.desc)+'"><span class="bi">'+BLD_ICONS[k]+'</span><b>'+b.name+'</b><small>$'+fmtB(bCost(c,k))+' · '+b.days+'d</small>'+(lock?'<em>'+lock+'</em>':'')+'</button>'; }).join("")+'</div>';
  if (c.buildQ.length) h+='<div class="qchips">'+c.buildQ.map((q,i)=>'<div class="qchip">'+ring(q.prog/q.total,40,"#e2c25a",BLD_ICONS[q.b],4)+'<span><b>'+BUILDINGS[q.b].name+'</b><small>'+esc(P[q.prov].name)+'</small></span><button class="x" data-a="cancelBuild" data-v="'+i+'">✕</button></div>').join("")+'</div>';
  // resources
  const pr=c.prod||resProduction(c), de=c.dem||resDemand(c);
  h+='<details><summary>Resources</summary><div class="rtiles">'+RES_KEYS.map(k=>{ const n=pr[k]-de[k]; return '<div class="rtile"><span class="bi">'+RES_ICONS[k]+'</span><b>'+(c.stock[k]||0).toFixed(1)+'</b><small>'+RES_NAMES[k]+'</small><em class="'+(n>=0?'pos':'neg')+'">'+(n>=0?"▲":"▼")+Math.abs(n).toFixed(2)+'/mo</em></div>'; }).join("")+'</div></details>';
  h+='<div class="row"><button class="btn" data-a="loan">🏦 Borrow 5% of GDP</button><button class="btn" data-a="repay">💳 Repay debt</button></div>';
  return ["💰 Economy",h];
};
ACT.bprov=(d,el)=>{ UIState.bprov=el.value; };
ACT.buildTile=d=>{ const c=C[G.player]; const k=d.v; let list;
  if (UIState.bprov!=="auto") list=[P[+UIState.bprov]]; else list=ownedProvs(c.tag).filter(p=>p.ctrl===c.tag).sort((a,b)=>((a.bld[k]||0)-(b.bld[k]||0))||(provGDP(b)-provGDP(a)));
  let msg="No province can take this building."; for (const p of list){ const [ok,m]=queueBuild(c,p.id,k); if (ok){ notify("🏗️ "+m,"good"); sfx("click"); refreshPanel(true); updateTop(); return; } msg=m; }
  notify("✖ "+msg,"bad"); };

function unitTiles(c,pid){ return '<div class="seg">'+[1,5,10,25].map(n=>'<button class="'+(UIState.batch===n?'on':'')+'" data-a="batch" data-v="'+n+'">×'+n+'</button>').join("")+'</div><div class="tiles units">'+UNIT_KEYS.map(k=>{ const u=UNITS[k]; const err=canRecruit(c,k,pid); return '<button class="tile utile'+(err?' dis':'')+'" data-a="recruitTile" data-v="'+k+'" data-p="'+pid+'" title="'+esc(err||"")+'"><img class="uimg huge" src="'+unitURL(k)+'"><b>'+u.name+'</b><small>⚔️'+u.atk+' 🛡️'+u.def+' · $'+fmtB(uCost(c,k)*UIState.batch)+'</small>'+(err?'<em>🔒 '+esc(err)+'</em>':'')+'</button>'; }).join("")+'</div>'; }
function trainQueue(c){ return c.recruitQ.length? '<div class="qchips">'+c.recruitQ.map(q=>'<div class="qchip">'+ring(q.prog/q.total,40,"#60a5fa",'<img class="uimg sm" src="'+unitURL(q.u)+'">',4)+'<span><b>'+q.n+'× '+UNITS[q.u].name+'</b><small>'+esc(P[q.prov].name)+' · '+Math.ceil(q.total-q.prog)+'d</small></span></div>').join("")+'</div>' : ""; }
function armyCard(a){ const k=mainUnit(a); const st=a.battle?["⚔️ Fighting","red"]:a.training?["🎓 Training","gold"]:a.retreating?["↩️ Retreating","red"]:a.auto?["⚔️ Invading","red"]:a.path.length?["➡️ Moving","blue"]:["💤 Idle",""];
  return '<button class="acard" data-a="selArmy" data-v="'+a.id+'"><span class="acimg" style="background:'+displayColor(a.owner)+'"><img src="'+unitURL(k)+'"></span><span class="act"><b>'+esc(a.name)+'</b><small>📍 '+esc(P[a.prov].name)+'</small><span class="mor"><i style="width:'+a.org+'%"></i></span></span><span class="acp"><b>⚔️ '+fmtN(armyPower(a))+'</b><em class="pill '+st[1]+'">'+st[0]+'</em></span></button>'; }
PANELS.military = ()=>{
  const c=C[G.player]; if(!c) return ["Army",""]; const armies=G.armies.filter(a=>a.owner===c.tag);
  const rank=Object.values(C).filter(x=>x.alive).sort((a,b)=>milStrength(b.tag)-milStrength(a.tag)).findIndex(x=>x.tag===c.tag)+1;
  let h=heroBox("⚔️",fmtN(milStrength(c.tag))+" power","#"+rank+" strongest in the world");
  h+='<div class="bubs">'+bubble("🪖",fmtN(c.manpower),"soldiers ready")+bubble("🗂️",armies.length,"armies")+bubble("😩",Math.round(c.warExh)+"%","war tiredness",c.warExh>40?"neg":"")+'</div>';
  h+=invadeBanner(c.tag,enemiesOf(c.tag));
  const cap = P[c.capital].owner===c.tag&&P[c.capital].ctrl===c.tag ? c.capital : (ownedProvs(c.tag).find(p=>p.ctrl===c.tag)||{}).id;
  if (cap!==undefined) h+='<div class="sech">🪖 Train troops <small>in '+esc(P[cap].name)+'</small></div>'+unitTiles(c,cap)+trainQueue(c);

  h+='<details><summary>Generals ('+c.generals.length+')</summary>'+c.generals.map(g=>'<div class="qrow">🎖️ <b>'+esc(g.name)+'</b> '+'⭐'.repeat(g.skill)+' <small>'+g.trait+'</small></div>').join("")+'<div class="row"><button class="btn" data-a="hireGen">Hire general ($'+fmtB(1+c.gdp*0.001)+')</button></div></details>';
  h+='<details><summary>How battles work</summary><p class="hint"><b>Battles are not random.</b> Each army has a ⚔️ Power number (units × attack & defense × tech, general, training and morale). Every day both sides lose troops based on the enemy’s power compared to their own, so the stronger side wins and loses fewer troops. An army 8× stronger wipes the enemy out instantly. Defenders get terrain bonuses (mountains +50%, jungle +25%, hills +20%, forest +15%) and +25% per fort level.</p></details>';
  return ["🪖 Army",h];
};

  const mine=a.owner===G.player; const c=C[a.owner]; const gen=generalOf(a);

  h+='<div class="tipbar">👆 Tap any place on the map to send this army there.</div>';
  h+='<div class="obtns"><button data-a="armyStop" data-v="'+a.id+'"><span>⏹</span>Stop</button><button data-a="armySplit" data-v="'+a.id+'"><span>✂️</span>Split</button><button data-a="armyMerge" data-v="'+a.id+'"><span>🔗</span>Merge</button><button data-a="armyHome" data-v="'+a.id+'"><span>🏠</span>Home</button><button data-a="deselect"><span>👋</span>Deselect</button><button class="red" data-a="armyDisband" data-v="'+a.id+'"><span>🗑️</span>Disband</button></div>';
  const ens=enemiesOf(a.owner);
  if (ens.length) h+='<div class="sech">⚔️ Invade</div><div class="seg wrap"><button class="'+(!a.auto?'on':'')+'" data-a="armyInvadeB" data-v="'+a.id+'" data-t="">🎮 Manual</button>'+(ens.length>1?'<button class="'+(a.auto==="all"?'on':'')+'" data-a="armyInvadeB" data-v="'+a.id+'" data-t="all">🌍 All enemies</button>':'')+ens.map(t=>'<button class="'+(a.auto===t?'on':'')+'" data-a="armyInvadeB" data-v="'+a.id+'" data-t="'+t+'">'+flagImg(C[t])+' '+esc(C[t].name)+'</button>').join("")+'</div>';
  h+='<div class="sech">🎓 Terrain training <small>+12% power & +10% speed per level</small></div>';
  if (a.training) h+='<div class="qchip">'+ring((G.day-a.training.start)/TRAIN_DAYS,40,"#e2c25a",TERRAIN_ICONS[a.training.t],4)+'<span><b>Training: '+TERRAIN_NAMES[a.training.t]+'</b><small>'+(a.training.until-G.day)+' days left</small></span></div>';
  h+='<div class="tiles terr">'+Object.keys(TERRAIN).map(t=>{ const lv=drillLv(a,t); const err=canTrain(a,t); return '<button class="tile'+(err?' dis':'')+'" data-a="train" data-v="'+a.id+'" data-t="'+t+'" title="'+esc(err||"")+'"><span class="bi">'+TERRAIN_ICONS[t]+'</span><b>'+TERRAIN_NAMES[t]+'</b><small class="stars">'+'★'.repeat(lv)+'<i>'+'☆'.repeat(TRAIN_MAX-lv)+'</i></small><small>'+(lv>=TRAIN_MAX?"Mastered":"$"+fmtB(trainCost(a,t)))+'</small></button>'; }).join("")+'</div>';
  h+='<div class="sech">🎖️ General</div><select data-a="assignGen" data-v="'+a.id+'"><option value="">— none —</option>'+c.generals.map(g=>'<option value="'+g.id+'"'+(a.general===g.id?' selected':'')+'>'+esc(g.name)+' '+'⭐'.repeat(g.skill)+' ('+g.trait+')'+(g.army&&g.army!==a.id?' [busy]':'')+'</option>').join("")+'</select>';
  return ["🪖 Army",h];
};
ACT.armyInvadeB=d=>{ const a=G.armies.find(x=>x.id===+d.v); if (!a) return; a.auto=d.t||null; a.path=[]; if (a.auto && !a.battle) aiArmyOrder(a,C[a.owner],null,0,invadeFilter(a.auto)); refreshPanel(true); mapDirty(false); };

// ---------- RESEARCH (Rise of Nations style tree) ----------
function techLayout(cat){
  const ids=Object.keys(TECHS).filter(id=>TECHS[id][1]===cat); const depth={};
  const dep=id=>{ if (depth[id]!==undefined) return depth[id]; const ps=TECHS[id][3].filter(q=>TECHS[q][1]===cat); depth[id]=ps.length?1+Math.max(...ps.map(dep)):0; return depth[id]; };
  ids.forEach(dep); const pos={}; const used={};
  ids.slice().sort((a,b)=>depth[a]-depth[b]).forEach(id=>{ const col=depth[id]; used[col]=used[col]||new Set(); const ps=TECHS[id][3].filter(q=>pos[q]); let want=ps.length?Math.min(...ps.map(q=>pos[q].row)):0; while (used[col].has(want)) want++; used[col].add(want); pos[id]={col,row:want}; });
  return pos;
}
PANELS.research = ()=>{
  const c=C[G.player]; if(!c) return ["Research",""]; const rp=c.rpDay||rpPerDay(c);
  let h='<div class="slots">'+c.research.map((r,i)=> r? '<div class="slot2 on" data-a="techSel" data-v="'+r.id+'">'+ring(r.prog/TECHS[r.id][2],54,"#60a5fa",icon(TECH_ICONS[r.id],"tico"),5)+'<span><b>'+TECHS[r.id][0]+'</b><small>'+Math.ceil((TECHS[r.id][2]-r.prog)/Math.max(0.1,rp))+' days left</small></span><button class="x" data-a="cancelRes" data-v="'+i+'">✕</button></div>' : '<div class="slot2 empty"><span class="plus">＋</span><span><b>Empty slot</b><small>Tap a glowing technology</small></span></div>').join("")+'</div>';
  h+='<div class="rpline">🔬 '+rp.toFixed(1)+' research points per day · '+Object.keys(c.techs).length+'/'+Object.keys(TECHS).length+' technologies</div>';
  h+='<div class="ctabs">'+TECH_CATS.map(k=>{ const tot=Object.keys(TECHS).filter(id=>TECHS[id][1]===k); const done=tot.filter(id=>c.techs[id]).length; return '<button class="'+(UIState.tcat===k?'on':'')+'" data-a="tcat" data-v="'+k+'"><span>'+CAT_ICONS[k]+'</span><b>'+k+'</b><small>'+done+'/'+tot.length+'</small></button>'; }).join("")+'</div>';
  const pos=techLayout(UIState.tcat); const CW=128, RH=136, PADX=14, PADY=12; let maxC=0,maxR=0; for (const id in pos){ maxC=Math.max(maxC,pos[id].col); maxR=Math.max(maxR,pos[id].row); }
  const W=(maxC+1)*CW+PADX, H=(maxR+1)*RH+PADY; let lines="", nodes="";
  for (const id in pos){ const p=pos[id]; const x=PADX+p.col*CW, y=PADY+p.row*RH; const t=TECHS[id]; const done=c.techs[id]; const act=c.research.find(r=>r&&r.id===id); const avail=t[3].every(q=>c.techs[q]);
    for (const q of t[3]){ if (!pos[q]) continue; const qx=PADX+pos[q].col*CW+86, qy=PADY+pos[q].row*RH+36, tx=x, ty=y+36; lines+='<path d="M'+qx+' '+qy+' C'+(qx+24)+' '+qy+' '+(tx-24)+' '+ty+' '+tx+' '+ty+'" class="'+(c.techs[q]?'lit':'')+'"/>'; }
    const st=done?"done":act?"act":avail?"avail":"lock"; const ext=t[3].some(q=>!pos[q]);
    nodes+='<button class="tnode '+st+(UIState.tsel===id?' sel':'')+'" style="left:'+x+'px;top:'+y+'px" data-a="techSel" data-v="'+id+'"><span class="tbox">'+(act?ring(act.prog/t[2],72,"#60a5fa","",4):"")+icon(TECH_ICONS[id],"tico")+(done?'<i class="tok">✓</i>':st==="lock"?'<i class="tlk">🔒</i>':'')+(ext?'<i class="text">🔗</i>':'')+'</span><b>'+t[0]+'</b><small>'+(done?"Researched":act?Math.round(act.prog/t[2]*100)+"%":"🔬 "+t[2])+'</small></button>'; }
  const id=UIState.tsel && TECHS[UIState.tsel] ? UIState.tsel : null;
  if (id){ const t=TECHS[id]; const done=c.techs[id]; const act=c.research.find(r=>r&&r.id===id); const missing=t[3].filter(q=>!c.techs[q]);
    h+='<div class="tdetail"><span class="tbig">'+icon(TECH_ICONS[id],"tico")+'</span><div><b>'+t[0]+'</b><p>'+t[4]+'</p><small>'+CAT_ICONS[t[1]]+' '+t[1]+' · 🔬 '+t[2]+' points · about '+Math.ceil(t[2]/Math.max(0.1,rp))+' days</small>'+(missing.length?'<div class="chips sm">'+missing.map(q=>'<span class="chip red" data-a="techSel" data-v="'+q+'">🔒 needs '+TECHS[q][0]+'</span>').join("")+'</div>':'')+'</div>'+
      (done?'<span class="pill green">✓ Done</span>':act?'<span class="pill blue">Researching</span>':missing.length?'':'<button class="btn gold big" data-a="research" data-v="'+id+'">🔬 Research</button>')+'</div>'; }

  h+='<div class="cgrid">'+list.slice(0,60).map(x=>{ const r=getRel(pl,x.tag); const tp=milStrength(x.tag); return '<button class="ccard" data-a="panel" data-v="country:'+x.tag+'">'+flagImg(x,"flag huge")+'<b>'+esc(x.name)+'</b><span class="cface">'+face(r)+' <small style="color:'+relCol(r)+'">'+Math.round(r)+'</small></span><span class="mini"><i style="width:'+(mp/(mp+tp+1)*100).toFixed(0)+'%"></i></span><small>'+(atWar(pl,x.tag)?'⚔️ war':isAlly(pl,x.tag)?'🤝 ally':c.tradeAg[x.tag]?'📈 trade':(tp>mp?'💪 stronger':'🪶 weaker'))+'</small></button>'; }).join("")+'</div>';

PANELS.country = tag=>{

  h+='<div class="bubs four">'+bubble("👥",fmtPop(c.pop),"people")+bubble("💰","$"+fmtB(c.gdp),"economy")+bubble("⚔️",fmtN(milStrength(tag)),"power")+bubble("🗺️",own.length,"provinces")+'</div>';
  if (!pl||me){ h+='<div class="obtns"><button data-a="focusC" data-v="'+tag+'"><span>🎯</span>Show</button>'+(me?'<button data-a="panel" data-v="economy"><span>💰</span>Economy</button><button data-a="panel" data-v="military"><span>🪖</span>Army</button><button data-a="panel" data-v="advisor"><span>💡</span>Advisor</button>':'<button data-a="compare" data-v="'+tag+'"><span>📊</span>Compare</button>')+'</div>'; return [esc(c.name),h]; }
  const mp=milStrength(pl), tp=milStrength(tag); let allyP=0; if (al) for (const m of al.members) if (m!==tag) allyP+=milStrength(m);
  h+='<div class="card"><div class="ch">⚔️ Who is stronger?</div><div class="pcmp"><div>'+flagImg(C[pl],"flag big")+'<b>'+fmtN(mp)+'</b></div><div class="pbar"><i style="width:'+(mp/(mp+tp+1)*100).toFixed(1)+'%"></i></div><div>'+flagImg(c,"flag big")+'<b>'+fmtN(tp)+'</b></div></div><p class="verdict '+(mp>tp*1.2?'pos':mp<tp?'neg':'')+'">'+(mp>tp*2?"💪 You are much stronger.":mp>tp*1.2?"👍 You are stronger.":mp>=tp?"🤏 About equal.":"⚠️ They are stronger.")+(allyP?" Their allies add "+fmtN(allyP)+".":"")+'</p></div>';
  const r=getRel(tag,pl);
  h+='<div class="card relc"><span class="bigface">'+face(r)+'</span><div><b style="color:'+relCol(r)+'">'+relLabel(r)+' ('+Math.round(r)+')</b><div class="relbar"><i style="left:'+((r+100)/2).toFixed(1)+'%"></i></div><small>😡 enemy ←→ friend 😍</small></div></div>';
  const tags=[]; if (atWar(tag,pl)) tags.push('<span class="chip red">⚔️ At war</span>'); if (isAlly(tag,pl)) tags.push('<span class="chip green">🤝 Ally</span>'); if (C[pl].nap[tag]) tags.push('<span class="chip">✍️ Non-aggression</span>'); if (C[pl].defPact[tag]) tags.push('<span class="chip">🛡️ Defense pact</span>'); if (C[pl].tradeAg[tag]) tags.push('<span class="chip">📈 Trade</span>'); if (C[pl].guarantee[tag]) tags.push('<span class="chip">🔰 Guaranteed</span>'); if (C[tag].access[pl]) tags.push('<span class="chip">🚪 Access</span>'); if (C[pl].sanction[tag]) tags.push('<span class="chip red">🚫 Sanctioned</span>'); if (C[pl].cb[tag]) tags.push('<span class="chip gold">📜 War goal</span>'); if (inTruce(tag,pl)) tags.push('<span class="chip">🏳️ Truce</span>');
  if (tags.length) h+='<div class="chips">'+tags.join("")+'</div>';
  if (atWar(tag,pl)){ const w=G.wars.find(w=>(w.att.includes(pl)&&w.def.includes(tag))||(w.def.includes(pl)&&w.att.includes(tag))); h+=invadeBanner(pl,[tag].concat(enemiesOf(pl).filter(t=>t!==tag)).slice(0,4)); h+='<div class="obtns"><button class="gold" data-a="peaceUI" data-v="'+w.id+'" data-t="'+tag+'"><span>🕊️</span>Peace</button><button data-a="panel" data-v="war:'+w.id+'"><span>📜</span>War info</button><button data-a="focusC" data-v="'+tag+'"><span>🎯</span>Show</button></div>'; }
  const avail=Object.keys(DIPLO).filter(k=>DIPLO[k].can(pl,tag)); const MAIN=["improve","alliance","trade","nap","justify","support"];
  const dt=k=>{ const d=DIPLO[k]; return '<button class="tile'+(C[pl].di<d.di?' dis':'')+'" data-a="diplo" data-v="'+k+'" data-t="'+tag+'" title="'+esc(d.desc)+'"><span class="bi">'+DIP_ICONS[k]+'</span><b>'+d.name+'</b><small>'+(d.di?'🕊️ '+d.di:'free')+'</small></button>'; };
  if (avail.length){ h+='<div class="sech">🕊️ Diplomacy <small>you have '+Math.floor(C[pl].di)+' influence</small></div><div class="tiles">'+avail.filter(k=>MAIN.includes(k)).map(dt).join("")+'</div>'; const more=avail.filter(k=>!MAIN.includes(k)); if (more.length) h+='<details><summary>More actions ('+more.length+')</summary><div class="tiles">'+more.map(dt).join("")+'</div></details>'; }
  if (!atWar(tag,pl) && !isAlly(tag,pl)){ const pen=C[pl].cb[tag]? "✅ Justified — no penalty" : C[pl].nap[tag]? "⚠️ Breaks your pact (-15 stability)" : "⚠️ No war goal: -10 stability"; h+='<button class="warbtn" data-a="declareWar" data-t="'+tag+'"><span>⚔️</span><b>Declare war</b><small>'+pen+'</small></button>'; }
  h+='<div class="obtns"><button data-a="focusC" data-v="'+tag+'"><span>🎯</span>Show on map</button><button data-a="compare" data-v="'+tag+'"><span>📊</span>Compare</button></div>';
  return [esc(c.name),h];
};

  }
