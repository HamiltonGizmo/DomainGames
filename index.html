async function gz(obj){ const s=JSON.stringify(obj); if (!window.CompressionStream) return {j:s}; const cs=new Blob([s]).stream().pipeThrough(new CompressionStream("gzip")); return {z:new Uint8Array(await new Response(cs).arrayBuffer())}; }
async function ungz(m){ if (m.j!==undefined) return JSON.parse(m.j); const u=m.z instanceof Uint8Array?m.z:new Uint8Array(m.z); const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip")); return JSON.parse(await new Response(ds).text()); }

// ---------- networking ----------
async function mpLoadPeer(){ if (window.Peer) return; await loadScript(PEER_URL,15000); if (!window.Peer) throw new Error("PeerJS failed to load"); }
function mpOpenPeer(id){ return new Promise((res,rej)=>{ let done=false; const p=id? new Peer(id,{debug:1}) : new Peer({debug:1});
  const t=setTimeout(()=>{ if(!done){ done=true; try{p.destroy();}catch(e){} rej(new Error("Could not reach the multiplayer server.")); } },14000);
  p.on("open",()=>{ if(done) return; done=true; clearTimeout(t); res(p); });
  p.on("error",e=>{ if(done) { mpPeerError(e); return; } done=true; clearTimeout(t); rej(e); }); }); }
function mpPeerError(e){ console.warn("peer error",e); if (MP.role==="client" && e && e.type==="peer-unavailable") mpFail("No game found with code "+MP.code+". Check the code and try again."); }
function send(conn,msg){ try{ if (conn && conn.open) conn.send(msg); }catch(e){ console.warn(e); } }
function mpSend(msg){ if (MP.role==="client") send(MP.hostConn,msg); }
function broadcast(msg, except){ for (const id in MP.players){ const pl=MP.players[id]; if (pl.conn && id!==except) send(pl.conn,msg); } }
function mpFail(msg){ modal('<div class="evh">👥 Multiplayer</div><p>'+esc(msg)+'</p><p class="hint">Multiplayer connects players directly through the internet (WebRTC). It works on the public version of this website. Inside claude.ai it is blocked, and some school/office networks block it too.</p><div class="row end"><button class="btn gold" data-a="closeModal">OK</button></div>'); }

function hostOnConn(conn){

  conn.on("close",()=>{ const id=Object.keys(MP.players).find(k=>MP.players[k].conn===conn); if (!id) return; const p=MP.players[id]; p.conn=null;
    if (MP.started && p.tag && C[p.tag]){ C[p.tag].isPlayer=false; notify("👋 "+p.name+" disconnected — the AI runs "+C[p.tag].name+" until they return.","info"); } else { delete MP.players[id]; }

async function hostOnData(conn,m){
  if (!m||!m.t) return;
  let id=Object.keys(MP.players).find(k=>MP.players[k].conn===conn);
  if (m.t==="hello"){
    if (m.map!==MAP_ID || m.np!==P.length){ send(conn,{t:"reject",why:"Your game loaded a different world map. Reload the page and try again."}); return; }
    // reconnecting player?
    let old=Object.keys(MP.players).find(k=>!MP.players[k].host && !MP.players[k].conn && MP.players[k].name===m.name);
    if (old){ id=old; MP.players[id].conn=conn; } else { id="p"+(G?G.nextId++:Date.now()); MP.players[id]={name:String(m.name||"Player").slice(0,16),tag:null,conn}; }
    send(conn,{t:"welcome",you:id,code:MP.code,started:MP.started});
    if (MP.started){ const p=MP.players[id]; if (p.tag && C[p.tag] && C[p.tag].alive){ C[p.tag].isPlayer=true; send(conn,{t:"start",tag:p.tag}); await hostSendFull(true,id); notify("👥 "+p.name+" rejoined as "+C[p.tag].name+".","good"); }
      else send(conn,{t:"pickNow",taken:Object.values(MP.players).map(x=>x.tag).filter(Boolean)}); }
    else notify("👥 "+MP.players[id].name+" joined the lobby.","good");
    hostSendLobby(); renderLobby(); return;
  }
  if (!id) return; const pl=MP.players[id];
  if (m.t==="pick"){ const tag=m.tag; const taken=Object.entries(MP.players).some(([k,p])=>k!==id&&p.tag===tag); if (!C[tag]||!C[tag].alive||taken){ send(conn,{t:"note",n:[["✖ That nation is taken or unavailable.","bad"]]}); return; }
    pl.tag=tag; if (MP.started){ C[tag].isPlayer=true; send(conn,{t:"start",tag}); await hostSendFull(true,id); notify("👥 "+pl.name+" now leads "+C[tag].name+".","good"); }
    hostSendLobby(); renderLobby(); return; }
  if (m.t==="chat"){ const msg={t:"chat",name:pl.name,text:String(m.text||"").slice(0,200)}; broadcast(msg); chatIn(msg); return; }
  if (!MP.started || !pl.tag || !C[pl.tag] || !C[pl.tag].alive) return;
  const tag=pl.tag;
  if (m.t==="cmd"){ const f=ORIG_ACT[m.a]; if (!f || !MP_CMDS.includes(m.a)) return;
    if (/^(army|armySplit|armyMerge|armyHome|armyDisband|armyStop|armyInvade|armyInvadeB|train|assignGen)/.test(m.a) && m.d && m.d.v){ const a=G.armies.find(x=>x.id===+m.d.v); if (!a||a.owner!==tag) return; }
    if (m.a==="speed"){ setSpeed(+m.d.v); MP.forceFull=true; return; }
    const ui={batch:m.ui&&m.ui.batch||5,bprov:m.ui&&m.ui.bprov||"auto"}; if (m.ui&&m.ui.peace){ const pz=m.ui.peace; ui.peace={w:pz.w,t:pz.t,annex:new Set(pz.annex),puppet:pz.puppet,rep:pz.rep,release:new Set(pz.release),white:pz.white}; }
    const notes=runAs(tag,()=>f(m.d||{},{value:m.v}),ui); if (notes.length) send(conn,{t:"note",n:notes}); return; }
  if (m.t==="move"){ const notes=runAs(tag,()=>{ const a=G.armies.find(x=>x.id===+m.army&&x.owner===tag); if (a && !a.training && orderMove(a,+m.pid)) a.auto=null; }); return; }
  if (m.t==="ev"){ const i=G.pendingEvents.findIndex(e=>e.uid===m.uid&&e.tag===tag); if (i<0) return; const e=G.pendingEvents.splice(i,1)[0]; const f=ORIG_ACT[m.a]; if (!f) return;
    const ui={}; if (e.type==="event") ui.ev={E:EVENTS.find(x=>x.id===e.id),data:e.data}; else if (e.type==="calltoarms") ui.cta=e; else if (e.type==="proposal") ui.prop=e; else ui.pe=e;
    const notes=runAs(tag,()=>f({v:m.v},null),ui); if (notes.length) send(conn,{t:"note",n:notes}); return; }
}
function hostCore(){ return {day:G.day,speed:G.speed,paused:G.paused,armies:G.armies,battles:G.battles,ctrl:P.map(p=>p.ctrl),occ:P.map(p=>Math.round(p.occ))}; }
async function hostSendFull(force,onlyId){
  const C2={}; for (const t in C){ const o=Object.assign({},C[t]); delete o.history; C2[t]=o; }
  const g={day:G.day,speed:G.speed,paused:G.paused,wars:G.wars,alliances:G.alliances,rel:G.rel,market:G.market,truce:G.truce,worldTension:G.worldTension,nextId:G.nextId,news:G.news.slice(0,60),battles:G.battles,armies:G.armies,mapId:MAP_ID};
  const prov=P.map(p=>[p.owner,p.ctrl,p.bld,Math.round(p.occ),Math.round(p.resist),+p.base.toFixed(4),+p.pop.toFixed(5),p.res,p.core]);
  const extra=Object.fromEntries(Object.entries(CDATA).filter(([k,v])=>v.generated||k.startsWith("RB")));
  const pack=await gz({g,C:C2,prov,extra,players:lobbyList()});
  for (const id in MP.players){ if (onlyId && id!==onlyId) continue; const p=MP.players[id]; if (!p.conn||!p.tag) continue;
    send(p.conn,Object.assign({t:"F"},pack)); send(p.conn,{t:"P",list:G.pendingEvents.filter(e=>e.tag===p.tag)}); }
  MP.lastFull=performance.now();
}
async function hostSendHistory(){ const h={}; for (const t in C) h[t]=C[t].history.slice(-240); const pack=await gz(h); broadcast(Object.assign({t:"H"},pack)); MP.lastHist=performance.now(); }
function hostTick(){
  if (!MPHost()) return; const now=performance.now();
  broadcast({t:"L",c:hostCore()});
  if (MP.forceFull || now-MP.lastFull>3000){ MP.forceFull=false; hostSendFull(); }
  if (now-MP.lastHist>30000) hostSendHistory();
  // drop unanswered events of friends after 45 days
  G.pendingEvents=G.pendingEvents.filter(e=>!(e.tag && e.tag!==G.player && G.day-(e.day||0)>45));
}
ACT.mpStart=()=>{ const me=MP.players.host; if (!me.tag) return; const aggr=G.settings.aiAggr; initGame(me.tag); G.settings.aiAggr=aggr; G.mp=true;
  for (const id in MP.players){ const p=MP.players[id]; if (p.tag && C[p.tag]) C[p.tag].isPlayer=true; }
  MP.started=true; const b=$("#mplobby"); if (b) b.remove(); enterGameUI(me.tag);
  for (const id in MP.players){ const p=MP.players[id]; if (!p.conn) continue; if (p.tag) send(p.conn,{t:"start",tag:p.tag}); else send(p.conn,{t:"pickNow",taken:Object.values(MP.players).map(x=>x.tag).filter(Boolean)}); }
  hostSendFull(true); hostSendHistory(); clearInterval(MP.timer); MP.timer=setInterval(hostTick,500);
  notify("👥 Multiplayer game started with "+Object.values(MP.players).filter(p=>p.tag).length+" players. Press ▶ when everyone is ready.","good"); };

// ---------- client ----------
async function clientOnData(m){
  if (!m||!m.t) return;
  if (m.t==="reject"){ mpFail(m.why); mpShutdown(); return; }
  if (m.t==="welcome"){ MP.myId=m.you; closeModal(); if (!m.started){ G=null; startSelection(); renderLobby(); notify("✔ Joined room "+MP.code+". Pick your nation!","good"); } return; }
  if (m.t==="lobby"){ MP.lobby=m.list; MP.myId=m.you||MP.myId; const me=m.list.find(x=>x.id===MP.myId); MP.myTag=me?me.tag:null; renderLobby(); return; }
  if (m.t==="pickNow"){ if (!G) initGame(null); const taken=new Set(m.taken); const list=Object.values(C).filter(x=>x.alive&&!taken.has(x.tag)).sort((a,b)=>b.gdp-a.gdp);
    modal('<div class="evh">👥 The game has started</div><p>Pick a nation to lead:</p><input class="search" placeholder="Filter…" oninput="this.nextElementSibling.querySelectorAll(\'.crow\').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(this.value.toLowerCase())?\'\':\'none\')"><div class="clist tall">'+list.map(x=>'<div class="crow" data-a="mpPick" data-v="'+x.tag+'">'+flagImg(x)+'<span><b>'+esc(x.name)+'</b><small>$'+fmtB(x.gdp)+'</small></span></div>').join("")+'</div>',"wide"); return; }
  if (m.t==="start"){ MP.myTag=m.tag; MP.pendingStart=true; return; }
  if (m.t==="F"){ const s=await ungz(m); clientApplyFull(s); if (MP.pendingStart){ MP.pendingStart=false; MP.started=true; closeModal(); const b=$("#mplobby"); if (b) b.remove(); enterGameUI(MP.myTag); notify("👥 You lead "+C[MP.myTag].name+". The host controls when time starts, but anyone can pause.","good"); } return; }
  if (m.t==="L"){ if (MP.started) clientApplyLight(m.c); return; }
  if (m.t==="P"){ for (const e of m.list){ if (MP.answered.has(e.uid)||MP.shown.has(e.uid)) continue; MP.shown.add(e.uid); MP.queue.push(e); } return; }
  if (m.t==="H"){ const h=await ungz(m); for (const t in h) if (C[t]) C[t].history=h[t]; return; }
  if (m.t==="note"){ MP.lastNoteT=performance.now(); MP.lastNotes=m.n.map(x=>x[0]).join(" "); for (const [msg,type,pid] of m.n) notify(msg,type,pid); return; }
  if (m.t==="chat"){ chatIn(m); return; }
  if (m.t==="bye"){ clientLost(true); return; }
}
function clientApplyFull(s){
  if (!G) initGame(null);
  const myTag=MP.myTag; const prev = (G && C[myTag]) ? {own:new Set(P.filter(p=>p.owner===myTag).map(p=>p.id)), techs:Object.keys(C[myTag].techs||{}), wars:G.wars?G.wars.map(w=>w.id):[], formed:(C[myTag].formed||[]).slice(), news:G.news&&G.news[0]?G.news[0].msg:null} : null;
  Object.assign(CDATA, s.extra||{});
  const keep={player:myTag,settings:G.settings,sel:G.sel,mapMode:G.mapMode,log:G.log,pendingEvents:[],spectator:false,_preview:false,mp:true};
  const hist={}; for (const t in C) hist[t]=C[t].history;
  Object.assign(G, s.g, keep); C=s.C; for (const t in C) C[t].history=hist[t]||[];
  let ownChange=false; s.prov.forEach((r,i)=>{ const p=P[i]; if (p.owner!==r[0]||p.ctrl!==r[1]) ownChange=true; [p.owner,p.ctrl,p.bld,p.occ,p.resist,p.base,p.pop,p.res,p.core]=r; });
  MP.lobby=s.players; MP.lastLight=performance.now();
  mapDirty(ownChange||true);
  if (prev && MP.started && C[myTag]){ const c=C[myTag];
    const now=new Set(P.filter(p=>p.owner===myTag).map(p=>p.id)); let gained=0,lost=0; for (const id of now) if (!prev.own.has(id)) gained++; for (const id of prev.own) if (!now.has(id)) lost++;
    if (gained) notify("🏴 You gained "+gained+" province"+(gained>1?"s":"")+"!","good"); if (lost) notify("🚩 You lost "+lost+" province"+(lost>1?"s":"")+".","bad");
    for (const t of Object.keys(c.techs)) if (!prev.techs.includes(t)) notify("🔬 Research complete: "+TECHS[t][0],"good");
    for (const w of G.wars) if (!prev.wars.includes(w.id) && (w.att.includes(myTag)||w.def.includes(myTag)) && !(performance.now()-(MP.lastNoteT||0)<6000 && (MP.lastNotes||"").includes(w.name))) { notify("⚔️ WAR! "+w.name,"war"); sfx("war"); }
    for (const f of c.formed) if (!prev.formed.includes(f)) formationAnim(c,FORMABLES[f]);
    if (G.news[0] && G.news[0].msg!==prev.news) notify(G.news[0].msg,"news");
    if (!c.alive) gameOver(); }
  updateTop(); if (PANEL && PANEL.live) refreshPanel();
}
function clientApplyLight(c){ G.day=c.day; G.speed=c.speed; G.paused=c.paused; const sel=G.sel; G.armies=c.armies; G.battles=c.battles; for (let i=0;i<P.length;i++){ if (P[i].ctrl!==c.ctrl[i]) { P[i].ctrl=c.ctrl[i]; mapDirty(true); } P[i].occ=c.occ[i]; } MP.lastLight=performance.now(); for (const a of G.armies) a.moving=!!(a.path.length&&!a.battle&&!a.training); mapDirty(false); }
function clientLost(bye){ if (MP.role!=="client") return; const wasStarted=MP.started;
  modal('<div class="evh">📡 '+(bye?'The host ended the game':'Connection to the host was lost')+'</div><p>'+(wasStarted?'You can keep playing this world on your own (single-player), or go back to the menu.':'')+'</p><div class="evopts">'+(wasStarted?'<button class="btn gold block" data-a="mpSolo">Keep playing alone</button>':'')+'<button class="btn block" data-a="mpLeave">Main menu</button></div>');
  MP.role=null; MP.started=false; }
ACT.mpSolo=()=>{ for (const t in C) C[t].isPlayer=(t===G.player); G.mp=null; mpShutdown(); closeModal(); G.paused=true; updateTop(); notify("You're now playing offline.","info"); };

// ---------- chat ----------
function chatIn(m){ MP.chat.push(m); if (MP.chat.length>60) MP.chat.shift(); notify("💬 "+m.name+": "+m.text,"info"); if ($("#chatlog")) renderChat(); }
function renderChat(){ const el=$("#chatlog"); if (!el) return; el.innerHTML=MP.chat.map(m=>'<div class="cmsg"><b>'+esc(m.name)+'</b> '+esc(m.text)+'</div>').join("")||'<p class="muted">No messages yet.</p>'; el.scrollTop=el.scrollHeight; }
ACT.mpPanel=()=>{ const list=MP.role==="host"?lobbyList():(MP.lobby||[]);
  modal('<div class="evh">👥 Room '+esc(MP.code)+' <button class="btn xs" data-a="mpCopy">Copy code</button></div><div class="lobp">'+list.map(p=>'<div class="lpl">'+(p.tag&&C[p.tag]?flagImg(C[p.tag],"flag big"):'<span class="nof">?</span>')+'<span><b>'+esc(p.name)+(p.host?' 👑':'')+'</b><small>'+(p.tag&&C[p.tag]?esc(C[p.tag].name):'choosing…')+(p.online?'':' · offline')+'</small></span></div>').join("")+'</div><h4>💬 Chat</h4><div id="chatlog" class="chatlog"></div><div class="row"><input class="search" id="chatin" maxlength="200" placeholder="Say something…" style="flex:1;margin:0"><button class="btn gold" data-a="chatSend">Send</button></div><div class="row end">'+(MP.role==="host"?'<small class="muted">Friends can join any time with the code.</small>':'')+'<button class="btn" data-a="closeModal">Close</button></div>',"wide"); renderChat(); const i=$("#chatin"); if (i){ i.focus(); i.addEventListener("keydown",e=>{ if (e.key==="Enter") ACT.chatSend(); }); } };
ACT.chatSend=()=>{ const i=$("#chatin"); const text=(i&&i.value.trim())||""; if (!text) return; i.value=""; const msg={t:"chat",name:MP.name,text}; if (MP.role==="host"){ broadcast(msg); chatIn(msg); } else send(MP.hostConn,msg); };

// ---------- route actions through the host when you're a client ----------
const MP_CMDS=["confirmWar","sendPeace","build","buildTile","cancelBuild","recruitTile","quickRecruit","research","cancelRes","armyStop","armySplit","armyMerge","armyHome","armyDisband","hireGen","loan","repay","buy","sell","decision","gov","lawSet","form","release","releaseFree","strike","nukeGo","invade","stopInvade","armyInvade","armyInvadeB","train","assignGen","diplo","tax","speed","evOpt","party","cta","prop","pe"];
const ORIG_ACT={};
for (const name of MP_CMDS){ const orig=ACT[name]; if (!orig) continue; ORIG_ACT[name]=orig;
  ACT[name]=function(d,el){
    if (!MPClient()) return orig(d,el);
    const dd=Object.assign({},d||{});
    if (["evOpt","party","cta","prop","pe"].includes(name)){ const e=UIState.curEv; if (e){ MP.answered.add(e.uid); send(MP.hostConn,{t:"ev",uid:e.uid,a:name,v:dd.v}); } $("#modal").dataset.blocking=""; closeModal(); return; }
    const pz=UIState.peace; const msg={t:"cmd",a:name,d:dd,v:el&&el.value,ui:{batch:UIState.batch,bprov:UIState.bprov,peace:pz?{w:pz.w,t:pz.t,annex:[...pz.annex],puppet:pz.puppet,rep:pz.rep,release:[...pz.release],white:pz.white}:null}};
    send(MP.hostConn,msg);
    if (name==="tax"){ orig(d,el); return; }
    if (["confirmWar","sendPeace","nukeGo"].includes(name)) closeModal();
    if (["armyDisband","release","releaseFree"].includes(name)) closePanel();
    sfx("click");
  };
}
// keep the "Multiplayer" menu entry pointing at the real lobby
const _renderMenu=renderMenu; renderMenu=function(){ _renderMenu(); const b=document.querySelector('#menuBtns [data-a="multiplayer"] small'); if (b) b.textContent="Play with friends"; };
// pick button in the nation preview while in a lobby
const _previewNation=previewNation; previewNation=function(tag){ _previewNation(tag); if (MP.role && !MP.started){ const btn=document.querySelector('#preview [data-a="playAs"]'); if (btn){ btn.dataset.a="mpPick"; btn.textContent="✔ Pick "+C[tag].name; } } };
// map clicks: send army moves to the host
const _mapClick=ui.mapClick; ui.mapClick=function(pid,army,e){ const sel = G && G.sel && G.sel.type==="army" ? G.armies.find(a=>a.id===G.sel.id) : null; const r=_mapClick(pid,army,e); if (MPClient() && sel && !army && pid>=0 && pid!==sel.prov && sel.owner===G.player && !sel.training) send(MP.hostConn,{t:"move",army:sel.id,pid}); return r; };
// top bar: players / chat chip
const _updateTop=updateTop; updateTop=function(){ _updateTop(); if (MP.started){ const tb=$("#topbar"); if (tb && !tb.querySelector(".mpchip")){ const b=document.createElement("button"); b.className="chip2 mpchip"; b.dataset.a="mpPanel"; const n=(MP.role==="host"?lobbyList():(MP.lobby||[])).filter(p=>p.tag&&p.online!==false).length; b.innerHTML='<i>👥</i><span><em>Room '+esc(MP.code)+'</em><b>'+n+' online</b></span>'; const menu=tb.querySelector(".tb-menu"); tb.insertBefore(b,menu); } } };
// leaving the game ends the session
const _toMenu=ACT.toMenu; ACT.toMenu=function(d){ if (MP.role && MP.started){ mpShutdown(); } return _toMenu(d); };
</script>
